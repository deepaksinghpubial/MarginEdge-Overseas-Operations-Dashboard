<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  rootRef = React.createRef();
  SD = {DATE:0, AN:1, TEAM:2, PROD:3, ERRS:4, PTS:5, ER:6, FS:7};
  QF = {DATE:0, AREA:1, VAR:2, AN:3, TEAM:4, LP:5, ENT:6, CLO:7, CUR:8, ST:9, URL:10, ORG:11, DIFFCLO:12};
  PAGES = {summary:"Executive Summary", overview:"Overview", leaderboard:"Analyst Performance", teams:"Team Lead Performance", teamreport:"Team Report", ams:"AM Performance", amreport:"AM Report", locations:"Location Comparison", specialist:"Specialist Performance", spprofile:"Individual Specialist Performance", anprofile:"Individual Analyst Performance", roles:"By Role", profile:"Analyst Profile", errorexplorer:"Error Explorer", reviewaudit:"Error Genuineness Review", coaching:"Coaching Queue", training:"Training Picks", compare:"Compare"};
  ICON = {
    errorexplorer:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/>',
    reviewaudit:'<path d="M9 11l3 3 7-7"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h9"/>',
    overview:'<path d="M3 3v18h18"/><path d="M7 16v2"/><path d="M12 11v7"/><path d="M17 6v12"/>',
    summary:'<path d="M4 4h16v16H4z"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/>',
    leaderboard:'<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v1.5a3 3 0 0 1-3 3"/><path d="M7 5H4v1.5a3 3 0 0 0 3 3"/>',
    specialist:'<path d="M12 2l2.4 5.2 5.6.6-4.2 3.8 1.2 5.6L12 20l-5 3 1.2-5.6L4 13.6l5.6-.6z"/>',
    spprofile:'<circle cx="12" cy="8" r="3.6"/><path d="M5 21a7 7 0 0 1 14 0"/><path d="M18 3l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/>',
    anprofile:'<circle cx="12" cy="8" r="3.6"/><path d="M5 21a7 7 0 0 1 14 0"/>',
    teams:'<circle cx="9" cy="8" r="3.4"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.8a3.4 3.4 0 0 1 0 6.4"/><path d="M20 20a6 6 0 0 0-4-5.6"/>',
    teamreport:'<circle cx="9" cy="8" r="3.4"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 4.8a3.4 3.4 0 0 1 0 6.4"/><path d="M20 20a6 6 0 0 0-4-5.6"/>',
    amreport:'<circle cx="12" cy="7" r="3.6"/><path d="M5 21a7 7 0 0 1 14 0"/>',
    profile:'<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>',
    compare:'<path d="M12 3v18"/><path d="M6 8h12"/><path d="M6 8l-2.5 6h5L6 8z"/><path d="M18 8l-2.5 6h5L18 8z"/>',
    coaching:'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
    training:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 2 6 2s6-1 6-2v-5"/>',
    locations:'<path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
    roles:'<path d="M4 20a5 5 0 0 1 10 0"/><circle cx="9" cy="8" r="3"/><path d="M15 8h6"/><path d="M15 12h6"/><path d="M15 16h6"/>',
    ams:'<rect x="3" y="4" width="7" height="7" rx="1.4"/><rect x="14" y="4" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>',
    doc:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/>'
  };

  renderVals() { return { root: this.rootRef }; }
  componentDidMount() { this.boot(); }

  boot() {
    if (!window.SCORES) { setTimeout(() => this.boot(), 40); return; }
    window.__QA_RELOAD = () => { this._reloading = true; this.boot(); };
    var prevPage = this._booted ? (this.st && this.st.page) : null;
    var prevSel = this._booted ? this.sel : null;
    var prevSt = this._booted ? this.st : null;
    this._booted = true;
    this.S = window.SCORES;
    this._sourceLoading = !!window.__QA_LOADING;
    this.Q = window.QA_DATA || null;
    this.st = { page:"summary", from:this.S.dates[0], to:this.S.dates[this.S.dates.length-1] };
    this.st.preset = "all";
    this.LOC = window.LOCATIONS || null;
    this.ROLE = window.ROLES || null;
    this.AM = window.AMS || null;
    // Error-review support: the Role Details roster feeds the reviewer picker,
    // DESIGNATIONS gives verbatim designations, REVIEWS is the saved audit trail.
    this.ROSTER = window.ROSTER || [];
    this.DESIG = window.DESIGNATIONS || { byLogin:{}, byName:{} };
    this.REVIEWS = window.REVIEWS || [];
    this._teamAllowed = {};
    if (this.AM) { for (var ti=0; ti<this.S.teams.length; ti++){ this._teamAllowed[ti] = !!this.AM.map[this.S.teams[ti]]; } }
    // Team membership is now governed entirely by the sheet loader (allowlisted
    // team leads + Specialist/Analyst designation). The old hardcoded per-person
    // exclude list wrongly dropped valid team members, so it is disabled.
    this.EXCL = {};
    this.st.role = "";
    if(this.st.exclusiveOnly==null) this.st.exclusiveOnly = true;
    this.sel = { dataSource: (window.__QA_ACTIVE_SOURCE_KEY||"live"), lbSearch:"", lbSort:"finalDesc", amSort:"finalDesc", prTeam:"", prAnalyst:"", cmpMode:"analysts", cmpA:"", cmpB:"", showAllMistakes:false, revOpen:null, revScope:"overall", revSaving:false, revError:null };
    if (prevSel) { for (var sk in prevSel) if (Object.prototype.hasOwnProperty.call(prevSel, sk)) this.sel[sk] = prevSel[sk]; }
    this.noteText = "Scores: legacy_analyst_daily_scores \u00b7 " + this.S.records.length.toLocaleString() + " analyst-days \u00b7 " + this.S.dates.length + " days";
    this.noteMistakes = this.Q ? ("Mistakes: " + this.Q.records.length.toLocaleString() + " rows \u00b7 " + this.Q.dates[0] + "\u2013" + this.Q.dates[this.Q.dates.length-1]) : "Mistakes: none loaded";
    this.noteLoc = this.LOC ? ("Locations: " + this.LOC.locations.map(l=>l+" "+this.LOC.counts[l]).join(", ")) : "Locations: none loaded";
    this.noteRole = this.ROLE ? ("Roles: " + this.ROLE.roles.map(l=>l+" "+this.ROLE.counts[l]).join(", ")) : "Roles: none loaded";
    this.rootRef.current.innerHTML = this.buildShell();
    if (prevPage && this.PAGES[prevPage]) this.st.page = prevPage;
    if (prevSt) {
      if (prevSt.from && this.S.dates.indexOf(prevSt.from) >= 0) this.st.from = prevSt.from;
      if (prevSt.to && this.S.dates.indexOf(prevSt.to) >= 0) this.st.to = prevSt.to;
      if (prevSt.preset) this.st.preset = prevSt.preset;
      if (prevSt.role != null) this.st.role = prevSt.role;
      if (prevSt.loc != null) this.st.loc = prevSt.loc;
      if (prevSt.exclusiveOnly != null) this.st.exclusiveOnly = prevSt.exclusiveOnly;
    }
    this._exTeams = null;
    // If a team report was open, re-resolve the team index by NAME (indices can
    // shift between sheet loads) so the drill-down survives the refresh.
    if (this.st.page === "teamreport" && this._teamReportName) {
      var ni = this.S.teams.indexOf(this._teamReportName);
      if (ni >= 0) this.sel.teamReport = ni; else this.st.page = "teams";
    }
    this.wire(); this.syncDates(); this.setActiveNav(); this.setTitle(); this.renderContent();
    this.watchLoadProgress();
  }

  watchLoadProgress(){
    if(this._loadPollTimer){ clearInterval(this._loadPollTimer); this._loadPollTimer=null; }
    if(!this._sourceLoading) return;
    var self=this;
    this._loadPollTimer=setInterval(function(){
      if(!window.__QA_LOADING){ clearInterval(self._loadPollTimer); self._loadPollTimer=null; return; }
      var el=self._q("#qa-ds-progress");
      var p=window.__QA_LOAD_PROGRESS;
      if(el) el.textContent = p&&p.total ? Math.round(p.loaded/p.total*100)+"%" : "…";
    }, 350);
  }

  _q(s){ return this.rootRef.current ? this.rootRef.current.querySelector(s) : null; }
  ic = (name) => '<svg viewBox="0 0 24 24">' + (this.ICON[name]||"") + '</svg>';
  esc = (s) => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  fs1 = (v) => v>=100 ? String(Math.round(v)) : (Math.round(v*10)/10).toFixed(1);
  pct = (v) => (v*100).toFixed(2)+"%";
  median = (arr) => { if(!arr.length) return 0; var a=arr.slice().sort((x,y)=>x-y); var m=Math.floor(a.length/2); return a.length%2?a[m]:(a[m-1]+a[m])/2; };
  fsColor = (v,med) => v>=med ? "var(--green)" : "var(--red)";
  erColor = (v,med) => v<=med ? "var(--green)" : "var(--red)";

  buildShell() {
    var nav = (p,l) => '<div class="sb-item" data-act="nav" data-arg="'+p+'">'+this.ic(p)+'<span>'+l+'</span></div>';
    return '<div class="qa"><style>'+this.shellCSS()+'</style><div class="app">'
      + '<aside class="sidebar">'
      +   '<div class="sb-brand"><img src="'+((window.__resources&&window.__resources.meLogo)||"assets/me-white.png")+'" alt="MarginEdge"><div class="ttl">Analyst Scoring</div><div class="sub">Legacy Portal \u00b7 Dhaka &amp; Chandigarh Operations</div></div>'
      +   '<div class="sb-group"><div class="sb-group-label">Insights</div>'+nav("summary","Executive Summary")+nav("ams","AM Performance")+nav("teams","Team Lead Performance")+nav("specialist","Specialist Performance")+nav("leaderboard","Analyst Performance")+'</div>'
      +   '<div class="sb-group"><div class="sb-group-label">Deep dive</div>'+nav("spprofile","Individual Specialist Performance")+nav("anprofile","Individual Analyst Performance")+'</div>'
      +   '<div class="sb-group"><div class="sb-group-label">QA &amp; Training</div>'+nav("errorexplorer","Error Explorer")+nav("reviewaudit","Error Genuineness Review")+nav("coaching","Coaching Queue")+nav("training","Training Picks")+nav("compare","Compare")+'</div>'
      +   '<div class="sb-admin">'
      +     this.sbSourceHTML("Legacy Productivity","https://docs.google.com/spreadsheets/d/16GBOjwfzCdJBASuSqr_8A-TCJPjEMZxK3EWWcz3ETmo/edit")
      +     '<div class="sb-note" id="qa-note">'+this.esc(this.noteText)+'</div>'
      +   '</div>'
      + '</aside>'
      + '<div class="main">'
      +   '<div class="topbar"><h1 id="qa-title"></h1>'
      +     '<div class="tb-right">'+this.sourceFilterHTML()+this.locFilterHTML()+this.roleFilterHTML()+'<div class="tb-presets"><button class="preset-btn" data-act="preset" data-arg="7">7d</button><button class="preset-btn" data-act="preset" data-arg="14">14d</button><button class="preset-btn" data-act="preset" data-arg="all">All</button></div><label>from</label><input type="date" id="qa-from" data-act="datefrom"><label>to</label><input type="date" id="qa-to" data-act="dateto"><button class="reset-btn" data-act="reset">Reset</button><button class="reset-btn" data-act="email" title="Build a presentable email from this view">\u2709 Email summary</button><button class="reset-btn" data-act="export" title="Export the current view to CSV">\u2913 Export CSV</button></div>'
      +   '</div>'
      +   '<div class="content" id="qa-content"></div>'
      +   '<div class="footer">Source: legacy_analyst_daily_scores mart (per analyst, per day). Higher final score &amp; lower error rate are better. Median &amp; \u0394 recompute across every analyst-day row in the selected range. Mistake detail (order links) comes from the Mistake Details export.</div>'
      + '</div></div></div>';
  }

  sourceFilterHTML(){
    var sources=window.__QA_SOURCES; if(!sources) return '';
    var cur=this.sel.dataSource||"live";
    var order=Object.keys(sources).sort((a,b)=>a==="live"?-1:b==="live"?1:0);
    var opts=order.map(k=>'<option value="'+k+'"'+(cur===k?' selected':'')+'>'+this.esc(sources[k].label)+'</option>').join('');
    var busy=this._sourceLoading;
    return '<div class="data-source-filter'+(cur!=="live"?' archive':'')+'"><label>Data</label><select data-act="datasource"'+(busy?' disabled':'')+'>'+opts+'</select>'+(busy?'<span class="ds-spin" title="Loading…"></span><span id="qa-ds-progress" class="ds-progress"></span>':'')
      +this.snapStampHTML()
      +'<button type="button" class="ds-refresh" data-act="refreshdata"'+(busy?' disabled':'')
      +' title="Re-read the Google Sheet now, ignoring the 60-second shared cache. Use this after editing the sheet.">\u21bb</button>'
      +'</div>';
  }
  sbSourceHTML(liveName,liveHref){
    var sources=window.__QA_SOURCES||{};
    var key=this.sel.dataSource||"live";
    var src=sources[key];
    var isLive=!src||!src.sheetId;
    var name=isLive?liveName:(src.label+" (archived snapshot)");
    var href=isLive?liveHref:("https://docs.google.com/spreadsheets/d/"+src.sheetId+"/edit");
    return '<div class="sb-source"><div class="lbl">'+this.ic("doc")+'Data source</div><div class="sb-source-name">'+this.esc(name)+' &middot; Google Sheet</div><a class="sb-source-link" href="'+this.esc(href)+'" target="_blank" rel="noopener">Open sheet \u2197</a></div>';
  }
  locFilterHTML(){ if(!this.LOC) return ''; var active=!!this.st.loc; var opts='<option value="">All Locations</option>'+this.LOC.locations.map(l=>'<option value="'+this.esc(l)+'"'+(this.st.loc===l?' selected':'')+'>'+this.esc(l)+'</option>').join(''); return '<div class="role-filter'+(active?' active':'')+'"><label>Location</label><select data-act="locfilter">'+opts+'</select></div>'; }
  roleFilterHTML(){ if(!this.ROLE) return ''; var active=!!this.st.role; var opts='<option value="">All roles</option>'+this.ROLE.roles.map(r=>'<option value="'+this.esc(r)+'"'+(this.st.role===r?' selected':'')+'>'+this.esc(r)+'</option>').join(''); return '<div class="role-filter'+(active?' active':'')+'"><label>Role</label><select data-act="rolefilter">'+opts+'</select></div>'; }
  exclusiveToggleHTML(){ var tgt=window.__SHEET_TARGET==="ipa"?"IPA":"Legacy"; var n=this.exclusiveTeamIdx?Object.keys(this.exclusiveTeamIdx()).length:0; return '<div class="excl-badge"><span class="excl-badge-main">'+tgt+' teams</span><span class="excl-badge-count">'+n+'</span></div>'; }

  wire() {
    var host = this.rootRef.current;
    host.addEventListener("click", this.onClick);
    host.addEventListener("change", this.onChange);
    host.addEventListener("input", this.onInput);
  }
  scrollToMistakeDetail(){ var el=this.rootRef.current&&this.rootRef.current.querySelector("#mistake-detail-anchor"); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
  scrollToErrDrill(){ var el=this.rootRef.current&&this.rootRef.current.querySelector("#err-drill-anchor"); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
  onClick = (e) => {
    var t = e.target.closest("[data-act]"); if(!t) return;
    var act=t.dataset.act, arg=t.dataset.arg;
    if(act==="nav") this.setPage(arg);
    else if(act==="reset") this.resetDates();
    else if(act==="process") this.startProcessing();
    else if(act==="processMistakes") this.startMistakes();
    else if(act==="processLoc") this.startLoc();
    else if(act==="processRole") this.startRole();
    else if(act==="profile") this.gotoProfile(arg);
    else if(act==="team") this.gotoTeam(arg);
    else if(act==="teamname") this.gotoTeamName(arg);
    else if(act==="am") this.gotoAM(arg);
    else if(act==="preset") this.setPreset(arg);
    else if(act==="export") this.exportCSV();
    else if(act==="email") this.showEmailModal();
    else if(act==="shoutdismiss"){ this.sel.shoutDismissed=true; this.renderContent(); }
    else if(act==="emailclose"){ var m=this.rootRef.current.querySelector("#qa-email"); if(m) m.remove(); }
    else if(act==="emailrich") this.copyEmail("rich");
    else if(act==="emailtext") this.copyEmail("text");
    else if(act==="showall"){ this.sel.showAllMistakes=true; this.renderContent(); }
    else if(act==="mistfilter"){ this.sel.mistFilterKind=t.dataset.kind; this.sel.mistFilterValue=arg; this.renderContent(); this.scrollToMistakeDetail(); }
    else if(act==="mistfilterclear"){ this.sel.mistFilterKind=null; this.sel.mistFilterValue=null; this.renderContent(); }
    else if(act==="mistsort"){ if(this.sel.mistSortCol===arg){ this.sel.mistSortDir=this.sel.mistSortDir==="asc"?"desc":"asc"; } else { this.sel.mistSortCol=arg; this.sel.mistSortDir="asc"; } this.renderContent(); }
    else if(act==="tblsort"){
      var tp=arg.split("::"), tid=tp[0], col=tp[1];
      this.sel.tblSort=this.sel.tblSort||{};
      var cur=this.sel.tblSort[tid];
      this.sel.tblSort[tid]=(cur&&cur.col===col)?{col:col,dir:cur.dir==="asc"?"desc":"asc"}:{col:col,dir:"asc"};
      this.renderContent();
    }
    else if(act==="errdim"){ this.sel.errDim=arg; this.sel.errSearch=""; this.sel.errDrill=null; this.sel.errDrillShow=100; this.renderContent(); }
    else if(act==="reloadlive"){ location.reload(); }
    else if(act==="refreshdata"){
      if(window.__QA_REFRESH){
        this._sourceLoading=true;
        window.__QA_REFRESH();
        this.renderContent();
        this.watchLoadProgress();
      } else location.reload();
    }
    else if(act==="rowmore"||act==="rowall"||act==="rowless"){
      var rkey=t.dataset.key||"lb";
      this.sel.rowShow=this.sel.rowShow||{};
      var curR=this.rowLimit(rkey);
      if(act==="rowmore") this.sel.rowShow[rkey]=curR+(parseInt(arg,10)||50);
      else if(act==="rowall") this.sel.rowShow[rkey]=1e9;
      else this.sel.rowShow[rkey]=this.rowsBase();
      this.renderContent();
    }
    else if(act==="revopen"){ this.openReview(arg, t.dataset.an||""); }
    else if(act==="revcancel"){ this.closeReview(); }
    else if(act==="revstop"){ /* clicks inside the dialog must not close it */ }
    else if(act==="revsave"){ this.saveReview(); }
    else if(act==="errdrill"){
      var edim=t.dataset.dim||this.sel.errDim||"area";
      var cur=this.sel.errDrill;
      if(cur&&cur.dim===edim&&String(cur.key)===String(arg)){ this.sel.errDrill=null; this.renderContent(); }
      else { this.sel.errDim=edim; this.sel.errDrill={dim:edim,key:arg}; this.sel.errDrillShow=100; this.renderContent(); this.scrollToErrDrill(); }
    }
    else if(act==="errdrillclose"){ this.sel.errDrill=null; this.renderContent(); }

  normTrendChart(labels, series, chartId){
    chartId=chartId||"trend";
    var hidden=(this.sel.chartHidden&&this.sel.chartHidden[chartId])||{};
    var w=1080,h=380,padL=26,padR=26,padT=22,padB=30, iw=w-padL-padR, ih=h-padT-padB;
    var xAt=function(i){ return padL+(labels.length===1?iw/2:i/(labels.length-1)*iw); };
    var grid=''; for(var t=0;t<=3;t++){ var y=padT+(t/3*ih); grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'; }
    var body=series.map(function(s,si){
      if(hidden[si]) return '';
      var vals=s.values.filter(function(v){return v!=null&&isFinite(v);});
      var lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), span=(hi-lo)||1;
      var pts=s.values.map(function(v,i){ if(v==null||!isFinite(v))return null; return [xAt(i), padT+ih-((v-lo)/span*ih*0.86)-ih*0.07, v]; }).filter(Boolean);
      if(!pts.length) return '';
      var path=''; pts.forEach(function(p,i){ if(i===0){path='M'+p[0].toFixed(1)+','+p[1].toFixed(1);return;} var p0=pts[i-1],cx=(p0[0]+p[0])/2; path+=' C'+cx.toFixed(1)+','+p0[1].toFixed(1)+' '+cx.toFixed(1)+','+p[1].toFixed(1)+' '+p[0].toFixed(1)+','+p[1].toFixed(1); });
      var dots=pts.map(function(p,i){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="#fff" stroke="'+s.color+'" stroke-width="2.2"><title>'+labels[i]+' \u00b7 '+s.name+': '+s.fmt(p[2])+'</title></circle>'; }).join('');
      return '<path class="me-trend" d="'+path+'" fill="none" stroke="'+s.color+'" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>'+dots;
    }).join('');
    var leg=series.map(function(s,si){
      if(hidden[si]) return '';
      var last=null; for(var i=s.values.length-1;i>=0;i--){ if(s.values[i]!=null&&isFinite(s.values[i])){ last=s.values[i]; break; } }
      return '<span style="display:inline-flex;align-items:center;gap:8px;margin:0 16px;font-size:13px;font-weight:700;color:var(--text)"><span style="width:18px;height:3px;border-radius:2px;background:'+s.color+';display:inline-block"></span>'+s.name+' <span style="color:'+s.color+';font-family:var(--font-num)">('+(last!=null?s.fmt(last):"\u2014")+')</span> <span style="font-weight:500;color:var(--muted);font-size:11px">latest</span></span>';
    }).join('');
    var checks=series.map(function(s,si){
      var checked=hidden[si]?'':' checked';
      return '<label style="display:inline-flex;align-items:center;gap:6px;margin:4px 12px;font-size:12.5px;font-weight:600;color:var(--text2,#3d434d);cursor:pointer"><input type="checkbox" data-act="chartseries" data-arg="'+chartId+'::'+si+'"'+checked+' style="width:14px;height:14px;accent-color:'+s.color+'"><span style="width:10px;height:10px;border-radius:2px;background:'+s.color+';display:inline-block"></span>'+s.name+'</label>';
    }).join('');
    var toolbar='<div class="chart-toolbar"><div style="text-align:center;margin-bottom:2px"><button class="reset-btn" style="font-size:11px" data-act="chartall" data-arg="'+chartId+'::show::'+series.length+'">\u2713 Check all</button> <button class="reset-btn" style="font-size:11px" data-act="chartall" data-arg="'+chartId+'::hide::'+series.length+'">\u2715 Uncheck all</button></div><div style="text-align:center">'+checks+'</div></div>';
    return '<div style="text-align:center;margin-bottom:12px">'+leg+'</div><svg viewBox="0 0 '+w+' '+h+'" class="me-chart" style="width:100%;height:auto">'+grid+body+'</svg>'+toolbar;
  }

  tblTh(tableId,label,col,right,extraStyle){

    return '<th class="mist-th mist-clickable'+(right?" r":"")+'"'+(extraStyle?' style="'+extraStyle+'"':'')+' data-act="tblsort" data-arg="'+tableId+'::'+col+'">'+label+arrow+'</th>';

  applyTblSort(list,tableId,getVal){
    var s=this.sel.tblSort&&this.sel.tblSort[tableId];
    if(!s) return list;
    var isNumStr=function(v){ if(typeof v==="number") return isFinite(v); var str=String(v==null?"":v).trim(); return str!==""&&/^-?\d+(\.\d+)?$/.test(str); };
    return list.slice().sort(function(a,b){
      var av=getVal(a,s.col), bv=getVal(b,s.col);
      var aNum=isNumStr(av), bNum=isNumStr(bv), c;
      if(aNum&&bNum) c=parseFloat(av)-parseFloat(bv);
      else if(aNum&&!bNum) c=-1;
      else if(!aNum&&bNum) c=1;
      else c=String(av).toLowerCase().localeCompare(String(bv).toLowerCase());
      return s.dir==="desc"?-c:c;
    });
  }

    var dayErrCount=ds.map(d=>{ var n=0; rws.forEach(r=>{ if(this.S.dates[r[D.DATE]]===d) n+=r[D.ERRS]; }); return n; });
    var maWin=3, movAvg=dayErrCount.map((_,i)=>{ var a=Math.max(0,i-maWin+1), sl=dayErrCount.slice(a,i+1); return sl.reduce((s,v)=>s+v,0)/sl.length; });
    var errTrend='<div class="card"><div class="card-head">Total errors per day \u2014 with '+maWin+'-day moving average</div><div class="card-body">'+this.multiLineChart(ds.map(d=>d.slice(5)),[{name:"Errors / day",color:"#d64530",values:dayErrCount},{name:maWin+"-day moving avg",color:"#2563EB",values:movAvg}],{fmt:v=>Math.round(v)})+'</div></div>';
    var performers='<div class="grid-2">'
      +'<div class="card"><div class="card-head" style="color:var(--green)">Top performers \u2014 final score</div><div class="card-body">'+this.rankBars(top.map(a=>({label:a.an,value:a.fs,disp:this.fs1(a.fs),act:"profile"})),()=>"var(--green)")+'<div class="chart-note">Analysts active \u2265'+minDays+' of '+ds.length+' days.</div></div></div>'
      +'<div class="card"><div class="card-head" style="color:var(--red)">Needs coaching \u2014 lowest final score</div><div class="card-body">'+this.rankBars(bottom.map(a=>({label:a.an,value:a.fs,disp:this.fs1(a.fs),act:"profile"})),()=>"var(--red)")+'<div class="chart-note">Lowest scorers active \u2265'+minDays+' days \u2014 candidates for training.</div></div></div>'
      +'</div>';
    return kpi+trend+errTrend+performers+this.methodPanel();
  }


  fxInline(title,text){
    return '<span class="fx-inline"><span class="kpi-fx">fx</span><div class="kpi-tip"><b>'+this.esc(title)+'</b>'+this.esc(text)+'</div></span>';
  }


  errDims(){
    return [
      {key:"type",label:"By Error Type",col:"Error type",noun:"error type"},
      {key:"area",label:"By Mistake Area",col:"Mistake area",noun:"mistake area"},
      {key:"restaurant",label:"By Restaurant",col:"Restaurant",noun:"restaurant"},
      {key:"lead",label:"By Lead",col:"Lead",noun:"lead"},
      {key:"am",label:"By Assistant Manager",col:"Assistant Manager",noun:"assistant manager"},
      {key:"analyst",label:"By Analyst",col:"Analyst",noun:"analyst"},
      {key:"day",label:"By Day",col:"Day",noun:"day"}
    ];
  }
  parseTenantUrl(url){
    if(!url) return null;
    var m=/[?&]tenantId=([^&]+)/.exec(url);
    if(!m) return null;
    var val; try{ val=decodeURIComponent(m[1]); }catch(_){ val=m[1]; }
    var us=val.lastIndexOf("_");
    if(us<0) return {slug:val,id:val};
    var idPart=val.slice(us+1), slugPart=val.slice(0,us);
    if(!/^\d+$/.test(idPart)) return {slug:val,id:val};
    return {slug:slugPart,id:idPart};
  }
  prettyTenantSlug(s){ return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):s; }
  // One keyer per dimension, shared by the dimension table and every drill-down
  // cross-tab so a row and its detail panel can never disagree.
  errKeyer(dim){
    var F=this.QF, Q=this.Q, self=this;
    if(dim==="type") return function(r){ var v=Q.vars[r[F.VAR]]||"—"; return {key:v,label:v}; };
    if(dim==="area") return function(r){ var v=Q.areas[r[F.AREA]]||"—"; return {key:v,label:v}; };
    if(dim==="restaurant") return function(r){ var t=self.parseTenantUrl((Q.url_prefix||"")+(r[F.URL]||"")); if(!t) return {key:"__unknown__",label:"Unknown / no order link"}; return {key:t.id,label:self.prettyTenantSlug(t.slug),sub:t.id}; };
    if(dim==="lead") return function(r){ var v=self.S.teams[r[F.TEAM]]||"Unassigned"; return {key:v,label:v}; };
    if(dim==="am") return function(r){ var v=self.amOf(self.S.teams[r[F.TEAM]])||"Unmapped"; return {key:v,label:v}; };
    if(dim==="analyst") return function(r){ var v=Q.analysts[r[F.AN]]||"—"; return {key:v,label:v}; };
    return function(r){ var v=Q.dates[r[F.DATE]]||"—"; return {key:v,label:v}; };
  }
  errBuckets(mrows,dim,hasDiff){
    var F=this.QF, keyer=this.errKeyer(dim), map={}, out=[];
    for(var i=0;i<mrows.length;i++){
      var r=mrows[i], kv=keyer(r), mk="k"+kv.key, b=map[mk];
      if(!b){ b=map[mk]={key:kv.key,label:kv.label,sub:kv.sub||null,count:0,proc:0,post:0}; out.push(b); }
      b.count++;
      if(hasDiff){ if(r[F.DIFFCLO]===true) b.proc++; else if(r[F.DIFFCLO]===false) b.post++; }
    }
    return out;
  }
  errRowLimit(dim){ var m=this.sel.errShow||{}; return Math.max(1, m[dim]||this.errRowsBase()); }
  errRowsBase(){ return 30; }

  pageErrorExplorer(rws){
    var F=this.QF;
    var dims=this.errDims();
    var dim=this.sel.errDim||"area";
    if(!dims.some(function(d){ return d.key===dim; })) dim="area";
    var dimDef=dims.filter(function(d){ return d.key===dim; })[0];
    var pillsH=dims.map(d=>'<button class="dim-pill'+(dim===d.key?' active':'')+'" data-act="errdim" data-arg="'+d.key+'">'+d.label+'</button>').join('');
    var fx=this.fxInline("Error Explorer","Counts every row in the Mistake Details export that matches the filters above (location, role, date range), grouped by the dimension you pick below.");
    var mrows=this.Q?(this.qaRowsForLogins(this.aggAnalysts(rws).map(a=>a.an))||[]):null;
    var total=mrows?mrows.length:0;
    var openHead='<div class="card"><div class="card-head">Error Explorer'+(mrows?' — '+total.toLocaleString()+' mistakes':'')+fx+'</div><div class="card-body">'
      +'<div class="dim-note">Pick a dimension to see where mistakes concentrate, then click any row — its name or its error count — to open every mistake behind it. The last column splits each row into errors caught during processing vs reported after production.</div>'
      +'<div class="dim-pills">'+pillsH+'</div>';
    if(this.Q===null) return openHead+'<div class="placeholder-msg">'+this.mistLoadingMsg("the mistake details")+'</div></div></div>';
    if(!total) return openHead+'<div class="placeholder-msg">No mistakes on record in this range.</div></div></div>';

    var hasDiff=mrows.some(r=>r[F.DIFFCLO]===true||r[F.DIFFCLO]===false);
    var list=this.errBuckets(mrows,dim,hasDiff);
    var fullN=list.length;
    var q=(this.sel.errSearch||"").trim().toLowerCase();
    if(q) list=list.filter(function(b){ return String(b.label).toLowerCase().indexOf(q)!==-1 || (b.sub&&String(b.sub).toLowerCase().indexOf(q)!==-1); });
    if(dim==="day") list.sort((a,b)=>a.label<b.label?-1:1);
    else list.sort((a,b)=>b.count-a.count);

    var noun=dimDef.noun, nounPl=noun+'s';
    var toolsH='<div class="dim-tools">'
      +'<input type="text" id="qa-errsearch" data-act="errsearch" placeholder="Search '+this.esc(dimDef.col.toLowerCase())+'…" value="'+this.esc(this.sel.errSearch||"")+'">'
      +(q?'<button type="button" class="reset-btn" data-act="errsearchclear" title="Clear the search">Clear ✕</button>':'')
      +'<span class="dim-tools-count">'+list.length.toLocaleString()+(q?' of '+fullN.toLocaleString():'')+' '+(list.length===1?noun:nounPl)+' in range</span>'
      +'</div>';
    if(!list.length) return openHead+toolsH+'<div class="placeholder-msg">No '+nounPl+' match “'+this.esc(this.sel.errSearch||"")+'”.</div></div></div>';

    var BASE=this.errRowsBase();
    var limit=this.errRowLimit(dim);
    var shown=(dim==="day")?list.slice(Math.max(0,list.length-limit)):list.slice(0,limit);
    var mx=Math.max.apply(null,shown.map(b=>b.count).concat([1]));
    var drill=this.sel.errDrill;
    var rowsH=shown.map(b=>{
      var share=total?(b.count/total*100):0;
      var w=(b.count/mx*100).toFixed(1);
      var on=!!(drill&&drill.dim===dim&&String(drill.key)===String(b.key));
      var att=' data-act="errdrill" data-dim="'+dim+'" data-arg="'+this.esc(String(b.key))+'"';
      var tip=' title="'+(on?'Hide the detail for':'See every mistake behind')+' this '+noun+'"';
      var labelH='<button type="button" class="dim-drill'+(on?' active':'')+'"'+att+tip+'>'+this.esc(b.label)+(b.sub?' <span class="dim-sub">#'+this.esc(b.sub)+'</span>':'')+'</button>';
      var cntH='<button type="button" class="dim-errs-btn'+(on?' active':'')+'"'+att+tip+'>'+b.count.toLocaleString()+'</button>';
      var pp=hasDiff?(b.proc.toLocaleString()+' / '+b.post.toLocaleString()):'—';
      return '<tr'+(on?' class="dim-row-on"':'')+'><td class="dim-label">'+labelH+'</td><td class="dim-bar"><div class="dim-bar-bg"><div class="dim-bar-fill" style="width:'+w+'%"></div></div></td><td class="r dim-errs">'+cntH+'</td><td class="r">'+share.toFixed(1)+'%</td><td class="r" style="color:var(--muted)">'+pp+'</td></tr>';
    }).join('');
    var expanded=shown.length>BASE;
    var table='<div class="'+(expanded?'dim-scroll':'dim-xscroll')+'"><table class="tbl"><thead><tr><th>'+dimDef.col+'</th><th></th><th class="r">Errors</th><th class="r">Share</th><th class="r">Proc / Post</th></tr></thead><tbody>'+rowsH+'</tbody></table></div>';
    var rest=list.length-shown.length;
    var moreH='';
    if(rest>0){
      moreH='<div class="dim-more">'
        +'<button type="button" class="dim-more-btn" data-act="errmore" data-dim="'+dim+'" data-arg="50">Show '+Math.min(50,rest).toLocaleString()+' more</button>'
        +'<button type="button" class="dim-more-btn ghost" data-act="errall" data-dim="'+dim+'">Show all '+list.length.toLocaleString()+'</button>'
        +(shown.length>BASE?'<button type="button" class="dim-more-btn ghost" data-act="errless" data-dim="'+dim+'">Collapse to top '+BASE+'</button>':'')
        +'<span class="dim-cap-note" style="margin:0">Showing '+shown.length.toLocaleString()+' of '+list.length.toLocaleString()+(dim==="day"?' days (most recent)':' — sorted by error count')+'</span></div>';
    } else if(shown.length>BASE){
      moreH='<div class="dim-more">'
        +'<button type="button" class="dim-more-btn ghost" data-act="errless" data-dim="'+dim+'">Collapse to top '+BASE+'</button>'
        +'<span class="dim-cap-note" style="margin:0">Showing all '+list.length.toLocaleString()+' '+nounPl+(q?' that match the search':'')+' — scroll the list to browse</span></div>';
    } else {
      moreH='<div class="dim-cap-note">Showing all '+list.length.toLocaleString()+' '+nounPl+(dim==="day"?'':' — sorted by error count')+'.</div>';
    }
    var restNote=dim==="restaurant"?'<div class="dim-cap-note">Restaurant name is the abbreviated tenant slug embedded in each order’s link (may be truncated vs. the restaurant’s full name) — the # is the exact tenant ID for a precise lookup. Restaurant type isn’t available in the connected sheet.</div>':'';
    var diffNote=hasDiff?'':'<div class="dim-cap-note">Processing vs. post-production isn’t tracked in this portal’s Mistake Details export, so the last column reads —.</div>';
    return openHead+toolsH+table+moreH+restNote+diffNote+'</div></div>'+this.errDrillCard(mrows,dim,dimDef,total,hasDiff);
  }

  // Detail panel for a single value of the active dimension (an error type, a
  // restaurant, a lead, ...): headline numbers, cross-tabs against every other
  // dimension, and the individual mistakes with their order links.
  errDrillCard(mrows,dim,dimDef,total,hasDiff){
    var d=this.sel.errDrill;
    if(!d||d.dim!==dim) return '';
    var F=this.QF, Q=this.Q;
    var keyer=this.errKeyer(dim), rows=[], label=null, sub=null;
    for(var i=0;i<mrows.length;i++){
      var kv=keyer(mrows[i]);
      if(String(kv.key)!==String(d.key)) continue;
      if(label===null){ label=kv.label; sub=kv.sub||null; }
      rows.push(mrows[i]);
    }
    var closeH='<button type="button" class="reset-btn dim-drill-close" data-act="errdrillclose" title="Close this detail view">Close ✕</button>';
    var titleH=this.esc(dimDef.col)+' · <b>'+this.esc(label==null?String(d.key):label)+'</b>'+(sub?' <span class="dim-sub">#'+this.esc(sub)+'</span>':'');
    if(!rows.length) return '<div class="card" id="err-drill-anchor"><div class="card-head">'+titleH+closeH+'</div><div class="placeholder-msg">No mistakes for this '+dimDef.noun+' under the current filters.</div></div>';

    var prettyArea=(a)=>({"LINE_ITEM":"Line Item","MISC_CHARGE":"Misc Charge","SINGLE_VARIABLE":"Header","Header":"Header","Line Item":"Line Item","Misc Charge":"Misc Charge"}[a]||a);
    var areaTag=(a)=>{ var p=prettyArea(a); return p==="Header"?"tag tag-hdr":p==="Line Item"?"tag tag-line":"tag tag-misc"; };
    var proc=0, post=0, anSet={}, daySet={}, restSet={}, dmin=null, dmax=null;
    for(var j=0;j<rows.length;j++){
      var r=rows[j];
      if(r[F.DIFFCLO]===true) proc++; else if(r[F.DIFFCLO]===false) post++;
      anSet["k"+(Q.analysts[r[F.AN]]||"?")]=1;
      var dt=Q.dates[r[F.DATE]];
      daySet["k"+dt]=1;
      if(dmin===null||dt<dmin) dmin=dt;
      if(dmax===null||dt>dmax) dmax=dt;
      var tn=this.parseTenantUrl((Q.url_prefix||"")+(r[F.URL]||""));
      if(tn) restSet["k"+tn.id]=1;
    }
    var nDays=Object.keys(daySet).length;
    var kpi='<div class="kpi-row" style="margin-bottom:18px">'
      +'<div class="kpi"><div class="k-label">Mistakes</div><div class="k-val" style="color:var(--accent)">'+rows.length.toLocaleString()+'</div><div class="k-sub">'+(total?(rows.length/total*100).toFixed(1):'0.0')+'% of all mistakes in range</div></div>'
      +'<div class="kpi"><div class="k-label">Processing / Post-prod</div><div class="k-val" style="font-size:21px">'+(hasDiff?proc.toLocaleString()+' / '+post.toLocaleString():'—')+'</div><div class="k-sub">'+(hasDiff?'caught while processing vs after production':'not tracked in this export')+'</div></div>'
      +'<div class="kpi"><div class="k-label">People involved</div><div class="k-val">'+Object.keys(anSet).length.toLocaleString()+'</div><div class="k-sub">analysts · '+Object.keys(restSet).length.toLocaleString()+' restaurants</div></div>'
      +'<div class="kpi"><div class="k-label">Days affected</div><div class="k-val">'+nDays.toLocaleString()+'</div><div class="k-sub">'+this.esc(dmin||'—')+' → '+this.esc(dmax||'—')+'</div></div>'
      +'<div class="kpi"><div class="k-label">Per active day</div><div class="k-val">'+(nDays?(rows.length/nDays).toFixed(1):'0')+'</div><div class="k-sub">mistakes / day</div></div>'
      +'</div>';

    var self=this;
    var crossDims=[["type","Top error types"],["area","Mistake areas"],["analyst","Top analysts"],["restaurant","Top restaurants"],["lead","Top leads"],["am","Assistant managers"],["day","Busiest days"]];
    // Every value here is clickable (name and count alike) and jumps straight
    // to that specific slice of errors -- switches the active dimension pill
    // to the mini-card's own dimension and opens the drill panel for it.
    var miniH=crossDims.filter(c=>c[0]!==dim).map(function(c){
      var sub2=self.errBuckets(rows,c[0],false).sort((a,b)=>b.count-a.count).slice(0,6);
      if(!sub2.length) return '';
      var items=sub2.map(b=>({label:String(b.label)+(b.sub?' #'+b.sub:''),key:b.key,dim:c[0],value:b.count,disp:b.count.toLocaleString(),act:"errdrill"}));
      return '<div class="drill-mini"><div class="drill-mini-t">'+c[1]+'</div>'+self.rankBars(items)+'</div>';
    }).join('');
    // Specialists are a distinct role from Analysts but share the "analyst"
    // dimension's key space, so this card reuses that dimension (pre-filtered
    // to Specialist-role logins) and is hidden while already drilled by analyst.
    var specH='';
    if(dim!=="analyst"){
      var specRows=rows.filter(r=>self.roleOf(Q.analysts[r[F.AN]])==="Specialist");
      var specBk=self.errBuckets(specRows,"analyst",false).sort((a,b)=>b.count-a.count).slice(0,6);
      if(specBk.length){
        var specItems=specBk.map(b=>({label:b.label,key:b.key,dim:"analyst",value:b.count,disp:b.count.toLocaleString(),act:"errdrill"}));
        specH='<div class="drill-mini"><div class="drill-mini-t">Top specialists</div>'+self.rankBars(specItems)+'</div>';
      }
    }
    var grid=(miniH||specH)?'<div class="drill-grid">'+miniH+specH+'</div>':'';

    var sorted=rows.slice().sort(function(a,b){ var da=Q.dates[a[F.DATE]], db=Q.dates[b[F.DATE]]; return da<db?1:da>db?-1:0; });
    var cap=Math.max(1,this.sel.errDrillShow||100);
    var page=sorted.slice(0,cap);
    var showRest=dim!=="restaurant";
    var showAn=dim!=="analyst";
    var detailRows=page.map(function(r,i){
      var org=r[F.DIFFCLO]===true?'<span class="tag tag-proc">Processing</span>':r[F.DIFFCLO]===false?'<span class="tag tag-pp">Post-prod</span>':'<span class="tag" style="background:var(--neutral-100);color:var(--muted)">—</span>';
      var area=Q.areas[r[F.AREA]];
      var anLogin=Q.analysts[r[F.AN]]||'';
      var anH=showAn?'<td style="font-family:var(--font-body)">'+(anLogin?'<button type="button" class="team-link" data-act="profile" data-arg="'+self.esc(anLogin)+'">'+self.esc(anLogin)+'</button>':'—')+'</td>':'';
      var restH='';
      if(showRest){
        var tn=self.parseTenantUrl((Q.url_prefix||"")+(r[F.URL]||""));
        restH='<td>'+(tn?self.esc(self.prettyTenantSlug(tn.slug))+' <span class="dim-sub">#'+self.esc(tn.id)+'</span>':'—')+'</td>';
      }
      return '<tr><td class="r">'+(i+1)+'</td><td>'+self.esc(Q.dates[r[F.DATE]])+'</td>'+anH
        +'<td><span class="'+areaTag(area)+'">'+self.esc(prettyArea(area))+'</span></td>'
        +'<td style="font-family:var(--font-body)"><a class="order-link" href="'+self.esc(Q.url_prefix+r[F.URL])+'" target="_blank" rel="noopener" title="Open order ↗">'+self.esc(Q.vars[r[F.VAR]])+' <span class="order-link-icon">↗</span></a></td>'
        +'<td>'+org+'</td>'+restH
        +'<td>'+self.esc(self.S.teams[r[F.TEAM]]||'—')+'</td>'
        +'<td class="r">'+(r[F.LP]||'—')+'</td>'
        +'<td style="font-family:var(--font-body)">'+(self.esc(r[F.ENT])||'—')+'</td>'
        +'<td style="font-family:var(--font-body)">'+(self.esc(r[F.CLO])||'—')+'</td>'
        +'<td style="font-family:var(--font-body)">'+(self.esc(r[F.CUR])||'—')+'</td>'
        +'<td style="font-family:var(--font-body)">'+self.esc(Q.statuses[r[F.ST]])+'</td></tr>';
    }).join('');
    var thead='<thead><tr><th class="r">S.No.</th><th>Date</th>'+(showAn?'<th>Analyst</th>':'')+'<th>Area</th><th>Variable — order link</th><th>Type</th>'+(showRest?'<th>Restaurant</th>':'')+'<th>Team lead</th><th class="r">Line pos</th><th>Entered</th><th>Closed</th><th>Current</th><th>Status</th></tr></thead>';
    var big=page.length>60;
    var tableH='<div class="'+(big?'dim-scroll':'dim-xscroll')+'" style="margin-top:0"><table class="tbl">'+thead+'<tbody>'+detailRows+'</tbody></table></div>';
    var left=sorted.length-page.length;
    var footH=left>0
      ? '<div class="note-strip">Showing '+page.length.toLocaleString()+' of '+sorted.length.toLocaleString()+' mistakes (newest first) — <button type="button" class="reset-btn" style="font-size:11px" data-act="errdrillmore" data-arg="200">show 200 more</button> · <button type="button" class="reset-btn" style="font-size:11px" data-act="errdrillmore" data-arg="all">show all '+sorted.length.toLocaleString()+'</button></div>'
      : '<div class="note-strip">Showing all '+sorted.length.toLocaleString()+' mistakes behind this '+dimDef.noun+' — newest first · every variable links straight to the order.</div>';
    return '<div class="card" id="err-drill-anchor"><div class="card-head">'+titleH+' — '+rows.length.toLocaleString()+' mistakes'+closeH+'</div>'
      +'<div class="card-body" style="padding-bottom:6px">'+kpi+grid+'</div>'+tableH+footH+'</div>';
  }


  // "Updated 11 Aug, 6:00 pm" beside the data picker. People need to know how
  // old the figures are; a dashboard that looks live but is two days stale is
  // worse than one that admits its age.
  snapStampHTML(){
    var s=window.__QA_SNAPSHOT;
    if(!s||!s.lastUpdated) return "";
    var d=new Date(s.lastUpdated);
    if(isNaN(d.getTime())) return "";
    var mins=Math.round((Date.now()-d.getTime())/60000);
    var age=mins<2?"just now":mins<60?mins+" min ago":mins<1440?Math.round(mins/60)+" h ago":Math.round(mins/1440)+" d ago";
    var stale=mins>36*60;   // a daily job that has not run for 1.5 days is late
    var when=d.toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
    return '<span class="ds-stamp'+(stale?' stale':'')+'" title="Snapshot generated '+this.esc(when)+' ('+age+')'
      +(stale?' — the daily job may not have run.':'')+'">'+(stale?'⚠ ':'')+'Updated '+this.esc(age)+'</span>';
  }

  // Shown at the top of every page when the live sheet could not be reached.
  // Without this the dashboard silently renders the BUNDLED sample data, which
  // has its own older dates, so the page looks perfectly healthy while the
  // numbers on it are not real — the worst possible failure mode for something
  // people make decisions from.
  liveFailBanner(){
    var f=window.__QA_LOAD_FAILED;
    if(!f) return "";
    var hint=/failed to load/i.test(f.message)
      ? 'The request never came back. Usually the Apps Script <b>/exec URL is wrong</b> — creating a <i>new deployment</i> issues a <i>new URL</i>, so use <b>Manage deployments → edit (pencil) → Version: New version</b> to keep the existing one. It can also mean the deployment’s “Who has access” is too restrictive, or this browser profile isn’t signed in to the right Google account.'
      : /timeout/i.test(f.message)
      ? 'The sheet took too long to respond. It may be a transient Apps Script quota limit — wait a minute and reload.'
      : 'Reason reported: '+this.esc(f.message)+'.';
    return '<div class="live-fail"><div class="live-fail-t">⚠ These are bundled sample figures, not your live data</div>'
      +'<div class="live-fail-b">The Google Sheet could not be loaded, so the dashboard fell back to the sample data built into the page. '
      +'<b>Do not read these numbers as current</b> — the dates shown are the sample’s own.</div>'
      +'<div class="live-fail-b">'+hint+'</div>'
      +'<div class="live-fail-b"><a href="'+this.esc(f.url)+'" target="_blank" rel="noopener">Open the endpoint in this browser ↗</a> '
      +'— if that doesn’t show JSON, the dashboard can’t read it either. '
      +'<button type="button" class="reset-btn" data-act="reloadlive">Retry now</button></div></div>';
  }

  // The Mistakes export is the last and largest thing to load, so these views
  // are empty for a while on a cold load. Saying "not loaded" made that look
  // like a failure; report progress instead, and keep repainting until it
  // arrives so the user does not have to guess whether to refresh.
  mistLoadingMsg(what){
    if(window.__QA_LOADING){
      var p=window.__QA_LOAD_PROGRESS;
      var pctTxt=(p&&p.total)?" — "+Math.round(p.loaded/p.total*100)+"% ("+p.loaded.toLocaleString()+" of "+p.total.toLocaleString()+" rows)":"";
      this.pollMistLoad();
      return '<span class="mist-loading">Loading '+what+' from the Google Sheet'+pctTxt+'…</span>';
    }
    return what.charAt(0).toUpperCase()+what.slice(1)+' could not be loaded from the Google Sheet. Reload the page to try again.';
  }
  pollMistLoad(){
    if(this._mistPoll) return;
    var self=this;
    this._mistPoll=setInterval(function(){
      if(!window.__QA_LOADING){ clearInterval(self._mistPoll); self._mistPoll=null; self.renderContent(); return; }
      var el=self.rootRef.current&&self.rootRef.current.querySelector(".mist-loading");
      if(!el) return;
      var p=window.__QA_LOAD_PROGRESS;
      el.textContent="Loading from the Google Sheet"+((p&&p.total)?" — "+Math.round(p.loaded/p.total*100)+"% ("+p.loaded.toLocaleString()+" of "+p.total.toLocaleString()+" rows)":"")+"…";
    },400);
  }

  // Progressive row rendering for the big leaderboards.
  //
  // These tables used to emit every row up to a hard cap of 250 on every
  // render. Profiling showed the cost is dominated by DOM ELEMENT COUNT, not
  // payload size: 250 rows means ~2,500 cells plus 250 inline sparkline SVGs
  // for the browser to parse, style and lay out, and that happens again on
  // every sort, filter and date change. Trimming bytes barely helped; rendering
  // fewer rows does. Callers show a page at a time with explicit controls to
  // expand, matching the Error Explorer pattern already used elsewhere.
  rowsBase(){ return 50; }
  rowLimit(key){ var m=this.sel.rowShow||{}; return Math.max(1, m[key]||this.rowsBase()); }
  moreControls(key, shownN, totalN, noun){
    var BASE=this.rowsBase(), rest=totalN-shownN;
    if(rest<=0 && shownN<=BASE)
      return '<div class="dim-cap-note">Showing all '+totalN.toLocaleString()+' '+noun+'.</div>';
    var h='<div class="dim-more">';
    if(rest>0){
      h+='<button type="button" class="dim-more-btn" data-act="rowmore" data-key="'+key+'" data-arg="50">Show '+Math.min(50,rest).toLocaleString()+' more</button>'
        +'<button type="button" class="dim-more-btn ghost" data-act="rowall" data-key="'+key+'">Show all '+totalN.toLocaleString()+'</button>';
    }
    if(shownN>BASE)
      h+='<button type="button" class="dim-more-btn ghost" data-act="rowless" data-key="'+key+'">Collapse to top '+BASE+'</button>';
    h+='<span class="dim-cap-note" style="margin:0">Showing '+shownN.toLocaleString()+' of '+totalN.toLocaleString()+' '+noun
      +' \u00b7 the \u2913 CSV button exports the rows shown; \u2913 Export CSV at the top of the page always exports all '+totalN.toLocaleString()+'.</span></div>';
    return h;
  }

  // ======================= ERROR GENUINENESS REVIEW =========================
  // A mistake has no id of its own in the export, so reviews are keyed by the
  // combination that uniquely identifies one: the order it belongs to plus the
  // exact field and position flagged on it. Deliberately portal-agnostic, so a
  // verdict recorded in the Split view is the same verdict Legacy/IPA see.
  mistKey(r){
    var F=this.QF, Q=this.Q;
    return [Q.dates[r[F.DATE]], Q.areas[r[F.AREA]], Q.vars[r[F.VAR]],
      Q.analysts[r[F.AN]], (r[F.LP]==null?"":r[F.LP]), (r[F.URL]||"")].join("|");
  }
  reviewMap(){
    // Rebuilt per render rather than cached: window.REVIEWS is mutated in place
    // by the loader when a save succeeds, so a stale cache would hide it.
    var m={}, list=window.REVIEWS||this.REVIEWS||[];
    for(var i=0;i<list.length;i++) m[list[i].mistake_key]=list[i];
    return m;
  }
  designationOf(name){
    if(!name) return "";
    var d=this.DESIG||{byLogin:{},byName:{}};
    var k=String(name).toLowerCase();
    return (d.byName&&d.byName[k])||(d.byLogin&&d.byLogin[k])||"";
  }
  todayISO(){
    // Local system date, not UTC — a reviewer in IST late evening should not
    // have their review dated yesterday.
    var d=new Date(), p=(n)=>(n<10?"0":"")+n;
    return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
  }
  reviewVerdicts(){ return ["Genuine error","Ingenuine error"]; }
  reviewChip(rv){
    if(!rv) return '<span class="rev-chip rev-none">Not reviewed</span>';
    var g=/^genuine/i.test(rv.verdict||"");
    return '<span class="rev-chip '+(g?'rev-gen':'rev-ing')+'" title="'+this.esc((rv.verdict||'')+' · reviewed by '+(rv.reviewer_username||'?')+' on '+(rv.review_date||'?')+(rv.remarks?' · '+rv.remarks:''))+'">'+this.esc(g?'Genuine':'Ingenuine')+'</span>';
  }
  // The checkbox is the affordance the user asked for: ticked == reviewed.
  // rmap is optional but callers rendering a whole table should pass one:
  // rebuilding it per row is O(rows x reviews) and degrades as reviews pile up.
  reviewCell(r, rmap){
    var key=this.mistKey(r), rv=(rmap||this.reviewMap())[key];
    var an=this.Q.analysts[r[this.QF.AN]]||"";
    return '<td class="rev-cell" data-rev-key="'+this.esc(key)+'">'
      +'<label class="rev-box" title="'+(rv?'Reviewed — click to view or correct':'Click to review this error')+'">'
      +'<input type="checkbox" data-act="revopen" data-arg="'+this.esc(key)+'" data-an="'+this.esc(an)+'"'+(rv?' checked':'')+'>'
      +'</label>'+(rv?' '+this.reviewChip(rv):'')+'</td>';
  }
  openReview(key,anName){
    var rv=this.reviewMap()[key]||null;
    var parts=String(key).split("|");
    this.sel.revOpen={
      key:key,
      mistake_date:parts[0]||"",
      order_url:parts[5]||"",
      target:anName||parts[3]||"",
      reviewer:rv?rv.reviewer_username:"",
      verdict:rv?rv.verdict:"",
      remarks:rv?rv.remarks:"",
      review_id:rv?rv.review_id:"",
      existing:!!rv
    };
    this.sel.revError=null; this.sel.revSaving=false;
    this.enhanceReviewModal();
  }
  closeReview(){
    this.sel.revOpen=null; this.sel.revSaving=false; this.sel.revError=null;
    this.enhanceReviewModal();
    this.renderContent();
  }
  // The modal lives outside #qa-content so re-rendering the page underneath it
  // (which happens on save) cannot blow away the open dialog mid-edit.
  enhanceReviewModal(){
    var o=this.sel.revOpen, wrap=this._revModalEl;
    // This runs after EVERY render, so the idle case must not query the tree —
    // a querySelector over a 300KB page on every keystroke is pure waste.
    if(!o && !wrap) return;
    var host=this.rootRef&&this.rootRef.current; if(!host) return;
    // boot() rebuilds the shell wholesale, which orphans a cached node.
    if(wrap && !host.contains(wrap)){ wrap=null; this._revModalEl=null; }
    if(!o){
      if(wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap);
      this._revModalEl=null;
      return;
    }
    if(!wrap){
      wrap=document.createElement("div");
      wrap.id="qa-rev-modal";
      (host.querySelector(".app") || host).appendChild(wrap);
      this._revModalEl=wrap;
    }
    wrap.innerHTML=this.reviewModalHTML(o);
  }
  reviewModalHTML(o){
    var self=this;
    var roster=(this.ROSTER&&this.ROSTER.length)?this.ROSTER:[];
    var rOpts='<option value="">-- select reviewer --</option>'+roster.map(function(x){
      return '<option value="'+self.esc(x.u)+'"'+(String(o.reviewer).toLowerCase()===String(x.u).toLowerCase()?' selected':'')+'>'+self.esc(x.u)+'</option>';
    }).join('');
    var desig=o.reviewer?this.designationOf(o.reviewer):"";
    if(!desig&&o.reviewer){
      for(var i=0;i<roster.length;i++) if(String(roster[i].u).toLowerCase()===String(o.reviewer).toLowerCase()){ desig=roster[i].d||""; break; }
    }
    var vOpts='<option value="">-- select verdict --</option>'+this.reviewVerdicts().map(function(v){
      return '<option value="'+self.esc(v)+'"'+(o.verdict===v?' selected':'')+'>'+self.esc(v)+'</option>';
    }).join('');
    var targetDesig=this.designationOf(o.target);
    var noRoster=!roster.length;
    var link=o.order_url?'<a class="order-link" href="'+this.esc((this.Q&&this.Q.url_prefix||"")+o.order_url)+'" target="_blank" rel="noopener">open order ↗</a>':'—';
    return '<div class="rev-overlay" data-act="revcancel">'
      +'<div class="rev-dialog" role="dialog" aria-modal="true" data-act="revstop">'
      +  '<div class="rev-head"><span>'+(o.existing?'Edit error review':'Review this error')+'</span>'
      +    '<button type="button" class="rev-x" data-act="revcancel" title="Close without saving">✕</button></div>'
      +  '<div class="rev-ctx">'+this.esc(o.mistake_date||'—')+' · <b>'+this.esc(o.target||'—')+'</b>'
      +    (targetDesig?' <span class="rev-ctx-d">'+this.esc(targetDesig)+'</span>':'')+' · '+link+'</div>'
      +  '<div class="rev-body">'
      +    '<label class="rev-f"><span class="rev-l">Name of reviewer</span>'
      +      (noRoster
        ? '<input type="text" data-act="revreviewer" value="'+this.esc(o.reviewer||"")+'" placeholder="Role Details not loaded — type a username">'
        : '<select data-act="revreviewer">'+rOpts+'</select>')+'</label>'
      +    '<label class="rev-f"><span class="rev-l">Designation</span>'
      +      '<input type="text" value="'+this.esc(desig)+'" readonly placeholder="'+(o.reviewer?'not set in Role Details':'auto-fills from the reviewer')+'"></label>'
      +    '<label class="rev-f"><span class="rev-l">Date of review</span>'
      +      '<input type="text" value="'+this.esc(this.todayISO())+'" readonly></label>'
      +    '<label class="rev-f"><span class="rev-l">Is the error genuine?</span>'
      +      '<select data-act="revverdict">'+vOpts+'</select></label>'
      +    '<label class="rev-f rev-f-wide"><span class="rev-l">Remarks — outcome of the review</span>'
      +      '<textarea data-act="revremarks" rows="3" placeholder="What did you conclude, and why?">'+this.esc(o.remarks||"")+'</textarea></label>'
      +  '</div>'
      +  (this.sel.revError?'<div class="rev-err">'+this.esc(this.sel.revError)+'</div>':'')
      +  '<div class="rev-foot">'
      +    '<span class="rev-hint">'+(this.sel.revSaving?'Saving to the Google Sheet…':'Saved to the workbook’s “Error Reviews” tab, visible to everyone.')+'</span>'
      +    '<button type="button" class="rev-btn ghost" data-act="revcancel"'+(this.sel.revSaving?' disabled':'')+'>Cancel</button>'
      +    '<button type="button" class="rev-btn" data-act="revsave"'+(this.sel.revSaving?' disabled':'')+'>'+(this.sel.revSaving?'Saving…':'Save')+'</button>'
      +  '</div></div></div>';
  }
  saveReview(){
    var o=this.sel.revOpen; if(!o||this.sel.revSaving) return;
    if(!o.reviewer){ this.sel.revError="Pick who is doing the review."; this.enhanceReviewModal(); return; }
    if(!o.verdict){ this.sel.revError="Choose whether the error is genuine or ingenuine."; this.enhanceReviewModal(); return; }
    var rec={
      review_id:o.review_id||"",
      review_date:this.todayISO(),
      reviewer_username:o.reviewer,
      reviewer_designation:this.designationOf(o.reviewer)||(function(rs,u){ for(var i=0;i<rs.length;i++) if(String(rs[i].u).toLowerCase()===String(u).toLowerCase()) return rs[i].d||""; return ""; })(this.ROSTER||[],o.reviewer),
      portal:(window.__SHEET_TARGET||"legacy"),
      mistake_key:o.key,
      mistake_date:o.mistake_date,
      order_url:o.order_url,
      target_login:o.target,
      target_designation:this.designationOf(o.target),
      verdict:o.verdict,
      remarks:o.remarks||""
    };
    if(typeof window.__QA_SAVE_REVIEW!=="function"){
      this.sel.revError="Saving needs the updated Apps Script deployment — the review was not stored.";
      this.enhanceReviewModal(); return;
    }
    this.sel.revSaving=true; this.sel.revError=null; this.enhanceReviewModal();
    var self=this;
    window.__QA_SAVE_REVIEW(rec).then(function(){
      self.sel.revSaving=false;
      self.closeReview();
    }).catch(function(e){
      self.sel.revSaving=false;
      self.sel.revError="Could not save to the sheet ("+(e&&e.message||"unknown error")+"). Nothing was recorded — try again.";
      self.enhanceReviewModal();
    });
  }

  // Roster of everyone whose errors could be reviewed, so "Total errors" is
  // measured against the same filtered population the rest of the page uses.
  reviewScopes(){
    return [
      {key:"overall", label:"Overall Reviewed Errors"},
      {key:"person",  label:"Specialist / Analyst"},
      {key:"am",      label:"Assistant Manager"},
      {key:"lead",    label:"Leads"}
    ];
  }
  pageReviewAudit(rws){
    var F=this.QF, Q=this.Q;
    var fx=this.fxInline("Error Genuineness Review","Every mistake a reviewer has marked genuine or ingenuine, from the workbook’s “Error Reviews” tab. Percentages below are against the mistakes currently in scope (location, role and date filters above).");
    var head='<div class="card"><div class="card-head">Error Genuineness Review'+fx+'</div><div class="card-body">';
    if(this.Q===null) return head+'<div class="placeholder-msg">'+this.mistLoadingMsg("the mistake details")+'</div></div></div>';

    var mrows=this.qaRowsForLogins(this.aggAnalysts(rws).map(a=>a.an))||[];
    var total=mrows.length;
    var rmap=this.reviewMap();

    // Only count reviews whose mistake is actually in the current scope, so the
    // percentages cannot exceed 100% when a filter narrows the population.
    var inScope=[], gen=0, ing=0;
    for(var i=0;i<mrows.length;i++){
      var rv=rmap[this.mistKey(mrows[i])];
      if(!rv) continue;
      var row=Object.assign({},rv);
      row.__r=mrows[i];
      inScope.push(row);
      if(/^genuine/i.test(rv.verdict||"")) gen++; else ing++;
    }
    var nRev=inScope.length;
    var pc=(n,d)=>d>0?(n/d*100).toFixed(1)+"%":"—";

    var kpi='<div class="kpi-row">'
      +'<div class="kpi"><div class="k-label">Total errors</div><div class="k-val">'+total.toLocaleString()+'</div><div class="k-sub">in the selected filters</div></div>'
      +'<div class="kpi"><div class="k-label">Total errors reviewed</div><div class="k-val" style="color:var(--accent)">'+nRev.toLocaleString()+'</div><div class="k-sub">'+(total-nRev).toLocaleString()+' still to review</div></div>'
      +'<div class="kpi"><div class="k-label">Reviewed</div><div class="k-val">'+pc(nRev,total)+'</div><div class="k-sub">of all errors in scope</div></div>'
      +'<div class="kpi"><div class="k-label">Genuine errors</div><div class="k-val" style="color:var(--red)">'+gen.toLocaleString()+'</div><div class="k-sub">upheld on review</div></div>'
      +'<div class="kpi"><div class="k-label">Ingenuine errors</div><div class="k-val" style="color:var(--green)">'+ing.toLocaleString()+'</div><div class="k-sub">overturned on review</div></div>'
      +'<div class="kpi"><div class="k-label">Genuine</div><div class="k-val">'+pc(gen,nRev)+'</div><div class="k-sub">of reviewed errors</div></div>'
      +'<div class="kpi"><div class="k-label">Ingenuine</div><div class="k-val">'+pc(ing,nRev)+'</div><div class="k-sub">of reviewed errors</div></div>'
      +'</div>';

    var scope=this.sel.revScope||"overall";
    var scopes=this.reviewScopes();
    if(!scopes.some(x=>x.key===scope)) scope="overall";
    var scopeSel='<span class="ctrl-row" style="margin-left:auto"><select data-act="revscope">'
      +scopes.map(x=>'<option value="'+x.key+'"'+(scope===x.key?' selected':'')+'>'+this.esc(x.label)+'</option>').join('')
      +'</select></span>';

    var body=head+kpi+'<div class="dim-note">Tick the <b>Review</b> box beside any error on the Individual Analyst or Specialist pages to record a verdict. Reviews are stored in the workbook, so the whole team sees the same audit trail.</div></div></div>';

    if(!nRev){
      return body+'<div class="card"><div class="card-head">Reviewed errors — 0'+scopeSel+'</div><div class="placeholder-msg">No errors have been reviewed in this range yet.</div></div>';
    }

    // Breakdown by whichever level the dropdown asks for.
    var self=this;
    var groupOf=function(row){
      var r=row.__r;
      if(scope==="person") return self.Q.analysts[r[F.AN]]||"—";
      if(scope==="lead") return self.S.teams[r[F.TEAM]]||"Unassigned";
      if(scope==="am") return self.amOf(self.S.teams[r[F.TEAM]])||"Unmapped";
      return null;
    };
    var breakdown='';
    if(scope!=="overall"){
      var g={};
      inScope.forEach(function(row){
        var k=groupOf(row);
        if(!g[k]) g[k]={k:k,n:0,gen:0,ing:0};
        g[k].n++;
        if(/^genuine/i.test(row.verdict||"")) g[k].gen++; else g[k].ing++;
      });
      var glist=Object.keys(g).map(k=>g[k]).sort((a,b)=>b.n-a.n);
      var scopeLabel=scopes.filter(x=>x.key===scope)[0].label;
      breakdown='<div class="card"><div class="card-head">Reviewed errors by '+this.esc(scopeLabel)+' — '+glist.length.toLocaleString()+'</div>'
        +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>'+this.esc(scopeLabel)+'</th><th class="r">Reviewed</th><th class="r">Genuine</th><th class="r">Ingenuine</th><th class="r">Genuine %</th><th class="r">Ingenuine %</th></tr></thead><tbody>'
        +glist.map(function(x){
          return '<tr><td style="font-weight:600;font-family:var(--font-body)">'+self.esc(x.k)+'</td>'
            +'<td class="r">'+x.n.toLocaleString()+'</td>'
            +'<td class="r" style="color:var(--red);font-weight:700">'+x.gen.toLocaleString()+'</td>'
            +'<td class="r" style="color:var(--green);font-weight:700">'+x.ing.toLocaleString()+'</td>'
            +'<td class="r">'+pc(x.gen,x.n)+'</td><td class="r">'+pc(x.ing,x.n)+'</td></tr>';
        }).join('')
        +'</tbody></table></div></div>';
    }

    var sorted=inScope.slice().sort(function(a,b){ return (a.review_date<b.review_date)?1:(a.review_date>b.review_date)?-1:0; });
    var rowsH=sorted.map(function(row,i){
      var r=row.__r;
      var link=row.order_url
        ? '<a class="order-link" href="'+self.esc((Q.url_prefix||"")+row.order_url)+'" target="_blank" rel="noopener" title="Open order ↗">'+self.esc(Q.vars[r[F.VAR]]||"order")+' <span class="order-link-icon">↗</span></a>'
        : '—';
      var g=/^genuine/i.test(row.verdict||"");
      var targetName=row.target_login||Q.analysts[r[F.AN]]||"—";
      return '<tr><td class="r">'+(i+1)+'</td>'
        +'<td>'+self.esc(row.review_date||'—')+'</td>'
        +'<td style="font-weight:600;font-family:var(--font-body)">'+self.esc(row.reviewer_username||'—')+'</td>'
        +'<td>'+self.esc(row.reviewer_designation||'—')+'</td>'
        +'<td style="font-family:var(--font-body)">'+link+'</td>'
        +'<td style="font-family:var(--font-body)"><button type="button" class="team-link" data-act="profile" data-arg="'+self.esc(targetName)+'">'+self.esc(targetName)+'</button></td>'
        +'<td>'+self.esc(row.target_designation||self.designationOf(targetName)||'—')+'</td>'
        +'<td><span class="rev-chip '+(g?'rev-gen':'rev-ing')+'">'+(g?'Genuine':'Ingenuine')+'</span></td>'
        +'<td class="rev-remark">'+self.esc(row.remarks||'—')+'</td></tr>';
    }).join('');

    var tbl='<div class="card"><div class="card-head">Reviewed errors — '+sorted.length.toLocaleString()+scopeSel+'</div>'
      +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th class="r">S.No.</th><th>Date of review</th><th>Reviewer</th><th>Reviewer designation</th><th>Order link</th><th>Error by</th><th>Their designation</th><th>Verdict</th><th>Remarks</th></tr></thead><tbody>'
      +rowsH+'</tbody></table></div></div>';

    return body+breakdown+tbl;
  }

  exportTableEl(table, headEl){
    var ths=table.querySelectorAll("thead th");
    var headers=Array.prototype.map.call(ths,function(th){ return th.textContent.replace(/[\u25B2\u25BC]/g,"").trim().replace(/\s+/g," "); });
    // Order-link cells only carry the variable name in visible text (the URL
    // lives in the <a href>), so it silently dropped out of the CSV. Add it
    // as its own trailing column whenever any row in this table has a link.
    var hasLinks=!!table.querySelector("tbody a.order-link");
    if(hasLinks) headers=headers.concat(["Order link"]);
    var rows=[];
    var trs=table.querySelectorAll("tbody tr");
    for(var i=0;i<trs.length;i++){
      var tds=trs[i].querySelectorAll("td");
      if(!tds.length) continue;
      var row=Array.prototype.map.call(tds,function(td){ return td.textContent.trim().replace(/\s+/g," "); });
      if(hasLinks){
        var lk=trs[i].querySelector("a.order-link");
        row.push(lk?lk.href:"");
      }
      rows.push(row);
    }
    var titleTxt="table";
    if(headEl){
      var clone=headEl.cloneNode(true);
      var kill=clone.querySelectorAll(".tbl-export-btn,.ctrl-row");
      for(var k=0;k<kill.length;k++) kill[k].parentNode.removeChild(kill[k]);
      titleTxt=clone.textContent.split("\u2014")[0].trim()||"table";
    }
    var slug=titleTxt.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,50)||"table";
    var name="qa_"+slug+"_"+this.st.from+"_to_"+this.st.to+".csv";
    this.downloadCSV(name,[headers].concat(rows));
  }
  enhanceTableExport(root){
    if(!root) return;
    var cards=root.querySelectorAll(".card");
    for(var i=0;i<cards.length;i++){
      var card=cards[i];
      var table=card.querySelector("table.tbl");
      if(!table) continue;
      var head=card.querySelector(".card-head");
      if(!head || head.querySelector(".tbl-export-btn")) continue;

  pageSpecialist(rws){
    var D=this.SD;
    var sp=rws.filter(r=>this.roleOf(this.S.analysts[r[D.AN]])==="Specialist");
    if(!sp.length) return '<div class="card"><div class="placeholder-msg">No Specialist analyst-day rows in the selected range'+(this.st.loc?' for '+this.esc(this.st.loc):'')+'.</div></div>';
    var med=this.windowMedians(sp);
    var tblId="sp";
    var frDaily=(this.S&&this.S.frDaily)||{}, frTotal=(this.S&&this.S.frTotal)||{};
    var frFrom=this.st.from, frTo=this.st.to, FR_MIN=50;
    var list=this.aggAnalysts(sp).map(a=>{
      var daily=frDaily[a.anIdx];
      if(daily){
        var vals=Object.keys(daily).filter(d=>d>=frFrom&&d<=frTo).map(d=>daily[d]).filter(v=>v>=FR_MIN);
        a.frDays=vals.length;
        a.frSum=vals.reduce((s,v)=>s+v,0);
        a.fr=vals.length?a.frSum/vals.length:null;
      } else if(frTotal[a.anIdx]!=null){
        a.frDays=null; a.frSum=frTotal[a.anIdx]; a.fr=frTotal[a.anIdx];
      } else {
        a.frDays=null; a.frSum=0; a.fr=null;
      }
      return a;
    });
    var maxFr=Math.max.apply(null,list.map(a=>a.fr||0).concat([0.0001]));
    var hasFr=list.some(a=>a.fr!=null);
    // FR-blended position score: final score rewarded by Final-Review volume (up to +25%).
    list.forEach(a=>{ a.pos=a.fs*(1+0.25*((a.fr||0)/maxFr)); a.delta=a.fs-med.fs; });
    // Final points after considering FR counts: FR count x2 + final score, averaged
    // per day over the specialist's scored days in range (raw daily FR value, no
    // threshold -- days with no FR record on file count as 0).
    var fpSumByAn={}, fpDaysByAn={};
    sp.forEach(r=>{
      var an=r[D.AN], d=this.S.dates[r[D.DATE]];
      var daily=frDaily[an];
      var frv=(daily&&daily[d]!=null)?daily[d]:0;
      fpSumByAn[an]=(fpSumByAn[an]||0)+(frv*2+r[D.FS]);
      fpDaysByAn[an]=(fpDaysByAn[an]||0)+1;
    });
    list.forEach(a=>{ a.fp=fpDaysByAn[a.anIdx]?fpSumByAn[a.anIdx]/fpDaysByAn[a.anIdx]:a.fs; });
    var sort=this.sel.spSort||"fpDesc";
    list.sort(sort==="fpDesc"?(a,b)=>b.fp-a.fp:sort==="posDesc"?(a,b)=>b.pos-a.pos:sort==="frDesc"?(a,b)=>(b.fr||0)-(a.fr||0):sort==="finalDesc"?(a,b)=>b.fs-a.fs:sort==="errorAsc"?(a,b)=>a.er-b.er:(a,b)=>b.fp-a.fp);
    list=this.applyTblSort(list,tblId,(a,col)=>({name:a.an,team:a.team,fs:a.fs,fr:(a.fr||0),pos:a.pos,fp:a.fp,er:a.er,prod:a.prod,delta:a.delta,errs:a.errs,days:a.days}[col]));
    var hdrSort=!!(this.sel.tblSort&&this.sel.tblSort[tblId]);
    var q=(this.sel.spSearch||"").toLowerCase();
    var shown=list.filter(a=>!q||a.an.toLowerCase().indexOf(q)!==-1||a.team.toLowerCase().indexOf(q)!==-1);
    var mxFs=Math.max.apply(null,list.map(a=>a.fs).concat([0.0001]));
    var fpFx=this.fxInline("Final Points after considering FR counts","FR count \u00d7 2 + Final score, averaged per day over the specialist\u2019s scored days in range (days with no FR record on file count as 0).");
    var spLimit=this.rowLimit("sp");
    var spShownN=Math.min(shown.length,spLimit);
    var rowsH=shown.slice(0,spLimit).map((a,i)=>{
      var rk=i+1, top3=(!hdrSort&&sort==="fpDesc"&&rk<=3);
      var bStyle=top3?"background:var(--honey-600);color:#fff":"background:var(--neutral-100);color:var(--muted)";
      var dF=a.delta;
      var frBar=a.fr!=null?'<div class="ibar-wrap"><span style="color:var(--me-blue);font-weight:800;font-family:var(--font-num)">'+this.fs1(a.fr)+'</span>'+(a.frDays!=null?' <span style="color:var(--neutral-300);font-size:10.5px">('+a.frDays+'d\u226550)</span>':'')+'<div class="ibar-bg"><div class="ibar-fill me-grow" style="width:'+Math.min(100,(a.fr/maxFr*100)).toFixed(1)+'%;background:var(--me-blue)"></div></div></div>':'<span style="color:var(--neutral-300)">\u2014</span>';
      return '<tr><td><span class="rank-badge" style="'+bStyle+'">'+rk+'</span></td>'
        +'<td style="font-weight:700;font-family:var(--font-body)"><button class="team-link" data-act="profile" data-arg="'+this.esc(a.an)+'">'+this.esc(a.an)+'</button></td>'
        +'<td><button class="tag tag-team team-tag-link" data-act="teamname" data-arg="'+this.esc(a.team)+'">'+this.esc(a.team)+'</button></td>'
        +'<td class="r" style="font-weight:800;color:var(--honey-600);font-family:var(--font-num)">'+this.fs1(a.fp)+'</td>'
        +'<td class="r"><div class="ibar-wrap"><span style="color:'+this.fsColor(a.fs,med.fs)+';font-weight:800">'+this.fs1(a.fs)+'</span><div class="ibar-bg"><div class="ibar-fill" style="width:'+Math.min(100,a.fs/mxFs*100).toFixed(1)+'%;background:'+this.fsColor(a.fs,med.fs)+'"></div></div></div></td>'
        +'<td class="r">'+frBar+'</td>'
        +'<td class="r" style="color:var(--muted)">'+this.fs1(a.pos)+'</td>'
        +'<td><div style="display:flex;align-items:center;gap:6px">'+this.trendArrow(a.trend)+this.sparkline(a.series,a.trend.dir==="down"?"var(--red)":a.trend.dir==="up"?"var(--green)":"var(--muted)")+'</div></td>'
        +'<td class="r" style="color:'+this.erColor(a.er,med.er)+';font-weight:700">'+this.pct(a.er)+'</td>'
        +'<td class="r">'+this.fs1(a.prod)+'</td>'
        +'<td class="r"><span class="'+(dF>=0?"tag pill-good":"tag pill-bad")+'">'+(dF>=0?"+":"\u2212")+this.fs1(Math.abs(dF))+'</span></td>'
        +'<td class="r" style="color:var(--proc)">'+a.errs+'</td>'
        +'<td class="r" style="color:var(--muted)">'+a.days+'</td></tr>';
    }).join("");
    var sortOpt=(v,l)=>'<option value="'+v+'"'+(sort===v?" selected":"")+'>'+l+'</option>';
    var totFr=list.reduce((s,a)=>s+(a.frSum||0),0);
    return '<div class="card"><div class="card-head">Specialist performance \u2014 '+list.length+' specialists \u00b7 median final '+this.fs1(med.fs)+(hasFr?' \u00b7 '+totFr.toLocaleString()+' final reviews in range':'')
      +'<span style="margin-left:auto" class="ctrl-row"><input type="text" id="qa-spsearch" data-act="spsearch" placeholder="Search specialist or team\u2026" value="'+this.esc(this.sel.spSearch||"")+'"><select data-act="spsort">'+sortOpt("fpDesc","Final points (FR) \u2193")+sortOpt("posDesc","Position score \u2193")+sortOpt("frDesc","Avg FR/day \u2193")+sortOpt("finalDesc","Final score \u2193")+sortOpt("errorAsc","Error rate \u2191 (best)")+'</select></span></div>'
      +(hasFr?'<div class="note-strip">Ranked by Final Points after considering FR counts'+fpFx+' \u2014 FR count \u00d7 2 + final score, averaged per day. Position score (shown alongside) instead blends avg final score with average daily FR volume, lifting standing by up to 25% relative to the top reviewer. Avg FR/day only counts days with 50 or more FRs; older archives without daily FR data show a flat total instead.</div>':'')
      +'<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Rank</th>'+this.tblTh(tblId,"Specialist","name")+this.tblTh(tblId,"Team","team")+this.tblTh(tblId,"Final points after FR","fp",true)+this.tblTh(tblId,"Avg final score","fs",true)+this.tblTh(tblId,"Avg FR/day","fr",true)+this.tblTh(tblId,"Position score","pos",true)+'<th>Trajectory</th>'+this.tblTh(tblId,"Avg error rate","er",true)+this.tblTh(tblId,"Avg productivity","prod",true)+this.tblTh(tblId,"\u0394 vs median","delta",true)+this.tblTh(tblId,"Errors","errs",true,"color:var(--proc)")+this.tblTh(tblId,"Days","days",true)+'</tr></thead><tbody>'+rowsH+'</tbody></table></div>'
      +this.moreControls("sp",spShownN,shown.length,"specialists")+'</div>';
  }

  pageAMReport(rws){

    var med=this.windowMedians(rws);
    var days=mine.length;
    var avgFs=mine.reduce((s,r)=>s+r[D.FS],0)/days, avgEr=mine.reduce((s,r)=>s+r[D.ER],0)/days, avgProd=mine.reduce((s,r)=>s+r[D.PROD],0)/days;
    var totErr=mine.reduce((s,r)=>s+r[D.ERRS],0);

    var dayFs=ds.map(d=>{ var v=mine.filter(r=>S.dates[r[D.DATE]]===d); return v.length?v.reduce((s,r)=>s+r[D.FS],0)/v.length:0; });
    var dayEr=ds.map(d=>{ var v=mine.filter(r=>S.dates[r[D.DATE]]===d); return v.length?v.reduce((s,r)=>s+r[D.ER],0)/v.length:0; });
    var dayErrCount=ds.map(d=>{ var n=0; mine.forEach(r=>{ if(S.dates[r[D.DATE]]===d) n+=r[D.ERRS]; }); return n; });

      +'<div class="kpi"><div class="k-label">Avg final score</div><div class="k-val" style="color:'+this.fsColor(avgFs,med.fs)+'">'+this.fs1(avgFs)+'</div><div class="k-sub">median '+this.fs1(med.fs)+'</div></div>'
      +'<div class="kpi"><div class="k-label">Avg error rate</div><div class="k-val" style="color:'+this.erColor(avgEr,med.er)+'">'+this.pct(avgEr)+'</div><div class="k-sub">median '+this.pct(med.er)+'</div></div>'
      +'<div class="kpi"><div class="k-label">\u0394 vs median</div><div class="k-val" style="color:'+(dF>=0?"var(--green)":"var(--red)")+'">'+(dF>=0?"+":"\u2212")+this.fs1(Math.abs(dF))+'</div><div class="k-sub">final score</div></div>'
      +'<div class="kpi"><div class="k-label">Avg productivity</div><div class="k-val">'+this.fs1(avgProd)+'</div><div class="k-sub">points / analyst-day</div></div>'
      +'<div class="kpi"><div class="k-label">Total errors</div><div class="k-val" style="color:var(--proc)">'+totErr.toLocaleString()+'</div><div class="k-sub">in selected range</div></div>'
      +'</div>';
    var charts=labs.length?'<div class="card"><div class="card-head">Daily trend \u2014 final score, productivity, error rate<span style="font-weight:500;color:var(--muted);margin-left:8px">Each line scaled to its own range so trends stay comparable \u00b7 hover a point for the exact value</span></div><div class="card-body">'+this.normTrendChart(labs,[
      {name:"Final score",color:"#0f2942",values:dayFs,fmt:(v)=>this.fs1(v)},

    ],"trend-a")+'</div></div>':'';
    var charts2=labs.length?'<div class="card"><div class="card-head">Total errors per day</div><div class="card-body">'+this.multiLineChart(labs,[{name:"Errors / day",color:"#d64530",values:dayErrCount}],{fmt:v=>Math.round(v)})+'</div></div>':'';

    var dayFs=ds.map(d=>{ var v=mine.filter(r=>S.dates[r[D.DATE]]===d); return v.length?v.reduce((s,r)=>s+r[D.FS],0)/v.length:0; });
    var dayEr=ds.map(d=>{ var v=mine.filter(r=>S.dates[r[D.DATE]]===d); return v.length?v.reduce((s,r)=>s+r[D.ER],0)/v.length:0; });

      +'<div class="kpi"><div class="k-label">Avg final score</div><div class="k-val" style="color:'+this.fsColor(avgFs,med.fs)+'">'+this.fs1(avgFs)+'</div><div class="k-sub">median '+this.fs1(med.fs)+'</div></div>'
      +'<div class="kpi"><div class="k-label">Avg error rate</div><div class="k-val" style="color:'+this.erColor(avgEr,med.er)+'">'+this.pct(avgEr)+'</div><div class="k-sub">median '+this.pct(med.er)+'</div></div>'
      +'<div class="kpi"><div class="k-label">\u0394 vs median</div><div class="k-val" style="color:'+(dF>=0?"var(--green)":"var(--red)")+'">'+(dF>=0?"+":"\u2212")+this.fs1(Math.abs(dF))+'</div><div class="k-sub">final score</div></div>'
      +'<div class="kpi"><div class="k-label">Avg productivity</div><div class="k-val">'+this.fs1(avgProd)+'</div><div class="k-sub">points / analyst-day</div></div>'

    var charts=labs.length?'<div class="card"><div class="card-head">Daily trend \u2014 final score, productivity, error rate<span style="font-weight:500;color:var(--muted);margin-left:8px">Each line scaled to its own range so trends stay comparable \u00b7 hover a point for the exact value</span></div><div class="card-body">'+this.normTrendChart(labs,[
      {name:"Final score",color:"#0f2942",values:dayFs,fmt:(v)=>this.fs1(v)},
      {name:"Productivity",color:"#2563EB",values:dayProd,fmt:(v)=>this.fs1(v)},
      {name:"Error rate",color:"#93c5fd",values:dayEr,fmt:(v)=>(v*100).toFixed(2)+"%"}
    ],"trend-b")+'</div></div>':'';
    var charts2=labs.length?'<div class="card"><div class="card-head">Total errors per day</div><div class="card-body">'+this.multiLineChart(labs,[{name:"Errors / day",color:"#d64530",values:dayErrCount}],{fmt:v=>Math.round(v)})+'</div></div>':'';
    var mxFs=Math.max.apply(null,members.map(a=>a.fs).concat([0.0001]));

      +'<td class="r" style="color:'+this.erColor(a.er,med.er)+';font-weight:700">'+this.pct(a.er)+'</td>'

    var rosterTbl=(label,list)=>{ if(!list.length) return ''; return '<div class="card"><div class="card-head">'+label+' \u2014 '+list.length+', ranked by avg final score</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Rank</th><th>Name</th><th class="r">Avg final score</th><th class="r">Avg error rate</th><th class="r">Avg productivity</th><th class="r" style="color:var(--proc)">Errors</th><th class="r">Days</th></tr></thead><tbody>'+list.map(rowFn).join("")+'</tbody></table></div></div>'; };
    var specs=members.filter(a=>this.roleOf(a.an)==="Specialist");

    });

  mistakesFor(login){
    if(!this.Q) return null;
    var idx=this.Q.analysts.indexOf(login); if(idx===-1) return []; if(this.isExcluded(login)) return [];
    var F=this.QF, Q=this.Q, from=this.st.from, to=this.st.to;
    return this.Q.records.filter(r=>{ if(r[F.AN]!==idx) return false; var d=Q.dates[r[F.DATE]]; return d>=from && d<=to; });
  }

  dailyRecords(mine,login,teamName,anIdx,role){
    var S=this.S, D=this.SD;
    if(!mine||!mine.length) return "";
    var sorted=mine.slice().sort((a,b)=>a[D.DATE]-b[D.DATE]);
    var showFr=role==="Specialist";

    var rowsH=sorted.map(r=>{
      var d=S.dates[r[D.DATE]];
      var frv=frDaily[d]!=null?frDaily[d]:0;
      var frCell=showFr?'<td class="r">'+(frDaily[d]!=null?frDaily[d].toLocaleString():"\u2014")+'</td>':'';

    }).join("");
    var frTh=showFr?'<th class="r">Final Review count</th>':'';

    return '<div class="card"><div class="card-head">Daily productivity records ('+sorted.length+')</div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Date</th><th>Analyst</th><th>Team</th><th class="r">Productivity</th><th class="r">Errors</th><th class="r">Total Possible Error Points</th><th class="r">Error rate</th><th class="r">Final score</th>'+frTh+fpTh+'</tr></thead><tbody>'+rowsH+'</tbody></table></div></div>';
  }


  pageProfile(rws){ return this._profile(rws,{teamKey:"prTeam",anKey:"prAnalyst",teamAct:"prteam",anAct:"pranalyst",title:"Analyst drill-down"}); }

  _profile(rws,cfg){
    var S=this.S, D=this.SD, sel=this.sel;

    var teamKeys=Object.keys(byTeamMembers).sort((a,b)=>S.teams[a].localeCompare(S.teams[b]));
