    var aOpts='<option value="">-- choose '+this.esc(noun.toLowerCase())+' --</option>'+anKeys.map(k=>'<option value="'+k+'"'+(selAn===String(k)?" selected":"")+'>'+this.esc(S.analysts[k])+'</option>').join("");
    var ctrl='<div class="card"><div class="card-head">'+this.esc(cfg.title)+'<span style="margin-left:auto" class="ctrl-row"><label>Team</label><select data-act="'+cfg.teamAct+'">'+tOpts+'</select><label>'+this.esc(noun.charAt(0).toUpperCase()+noun.slice(1))+'</label><select data-act="'+cfg.anAct+'">'+aOpts+'</select></span></div></div>';
    if(selAn==="") return ctrl+'<div class="card"><div class="placeholder-msg">Select '+(/^[aeiou]/i.test(noun)?"an":"a")+' '+this.esc(noun.toLowerCase())+' to see their daily score trend, quality metrics, and full mistake detail with order links.</div></div>';
    var aIdx=parseInt(selAn);
    var mine=pool.filter(r=>r[D.AN]===aIdx);
    var med=this.windowMedians(rws);
    var login=S.analysts[aIdx], teamName=S.teams[S.analyst_team[aIdx]], role=this.roleOf(login);
    if(!mine.length) return ctrl+'<div class="card"><div class="placeholder-msg">'+this.esc(login)+' has no scored days in this range.</div></div>';
    var days=mine.length;
    var avgFs=mine.reduce((s,r)=>s+r[D.FS],0)/days, avgEr=mine.reduce((s,r)=>s+r[D.ER],0)/days, avgProd=mine.reduce((s,r)=>s+r[D.PROD],0)/days;
    var totErr=mine.reduce((s,r)=>s+r[D.ERRS],0), totPts=mine.reduce((s,r)=>s+r[D.PTS],0);
    var dF=avgFs-med.fs;
    var ds=this.datesInRange();
    var byDate={}; mine.forEach(r=>byDate[S.dates[r[D.DATE]]]=r);
    var labs=[],vFs=[],vEr=[],vProd=[],vErrs=[]; ds.forEach(d=>{ if(byDate[d]){ labs.push(d.slice(5)); vFs.push(byDate[d][D.FS]); vEr.push(byDate[d][D.ER]); vProd.push(byDate[d][D.PROD]); vErrs.push(byDate[d][D.ERRS]); } });
    var anim=cfg.anim;

      +(showFp?'<div class="kpi"><div class="k-label">Final points (FR-adj.)</div><div class="k-val" style="color:var(--honey-600)">'+this.fs1(avgFp)+'</div><div class="k-sub">avg per day \u00b7 FR\u00d72 + final score</div></div>':'')
      +'<div class="kpi"><div class="k-label">Avg final score</div><div class="k-val" style="color:'+this.fsColor(avgFs,med.fs)+'">'+this.fs1(avgFs)+'</div><div class="k-sub">median '+this.fs1(med.fs)+'</div></div>'
      +'<div class="kpi"><div class="k-label">Avg error rate</div><div class="k-val" style="color:'+this.erColor(avgEr,med.er)+'">'+this.pct(avgEr)+'</div><div class="k-sub">median '+this.pct(med.er)+'</div></div>'

    var wrap=(inner)=>anim?'<div class="anim-chart">'+inner+'</div>':inner;
    var vPtsLost=vFs.map((f,i)=>Math.abs(vProd[i])-Math.abs(f));
    var trendSeries=[
      {name:'Final score',color:'#2563EB',values:vFs,fmt:(v)=>this.fs1(v)},
      {name:'Errors per day',color:'#0f2a52',values:vErrs,fmt:(v)=>Math.round(v).toLocaleString()},

  mistakeDetail(login){
    var F=this.QF, m=this.mistakesFor(login);
    if(m===null) return '<div class="card" id="mistake-detail-anchor"><div class="card-head">Mistake detail</div><div class="placeholder-msg">'+this.mistLoadingMsg("the mistake details (order links)")+'</div></div>';
    if(!m.length) return '<div class="card" id="mistake-detail-anchor"><div class="card-head">Mistake detail &mdash; order links</div><div class="placeholder-msg">No individual mistakes on record for '+this.esc(login)+' in the Mistake Details export (it covers '+this.esc(this.Q.dates[0])+' \u2013 '+this.esc(this.Q.dates[this.Q.dates.length-1])+').</div></div>';
    var Q=this.Q, prettyArea=(a)=>({"LINE_ITEM":"Line Item","MISC_CHARGE":"Misc Charge","SINGLE_VARIABLE":"Header","Header":"Header","Line Item":"Line Item","Misc Charge":"Misc Charge"}[a]||a), areaTag=(a)=>{var p=prettyArea(a);return p==="Header"?"tag tag-hdr":p==="Line Item"?"tag tag-line":"tag tag-misc";};
    var fk=this.sel.mistFilterKind, fv=this.sel.mistFilterValue, full=m;

  startRole(){

    reader.onload=(e)=>{
      try{

        var h=rows[0].map(x=>x.trim().toLowerCase());
        var loginKeys=["analyst_login","username","login","user","analyst","user_login","name"];
        var roleKeys=["designation","role","title","job_title","position","level"];
        var li=-1,ri=-1; h.forEach((c,i)=>{ if(li<0&&loginKeys.indexOf(c)!==-1)li=i; if(ri<0&&roleKeys.indexOf(c)!==-1)ri=i; });
        var start=1; if(li<0||ri<0){ li=0; ri=1; start=0; }
        var norm=(v)=>{ var s=v.trim(); var l=s.toLowerCase(); if(/lead/.test(l))return "Lead"; if(/special/.test(l))return "Specialist"; if(/analyst/.test(l))return "Analyst"; if(/manager|mgr/.test(l))return "Manager"; if(/train/.test(l))return "Trainee"; return s.charAt(0).toUpperCase()+s.slice(1); };
        var map={}, cnt={}, count=0;
        for(var i=start;i<rows.length;i++){ var rr=rows[i]; if(rr.length<2) continue; var login=(rr[li]||"").trim(); var role=norm((rr[ri]||"")); if(!login||!role) continue; map[login.toLowerCase()]=role; cnt[role]=(cnt[role]||0)+1; count++; }
        if(!count) throw new Error("No login,designation pairs found.");
        var pref=["Lead","Specialist","Analyst","Manager","Trainee"];
        var roles=Object.keys(cnt).sort((a,b)=>{ var ia=pref.indexOf(a),ib=pref.indexOf(b); if(ia<0)ia=99; if(ib<0)ib=99; return ia-ib||a.localeCompare(b); });

  parseCSV(text){
    var rows=[],row=[],cur="",inQ=false;
    for(var i=0;i<text.length;i++){ var ch=text[i];
      if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=ch; }
      else { if(ch==='"') inQ=true; else if(ch===","){row.push(cur);cur="";} else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n")i++; row.push(cur);cur=""; if(row.length>1||row[0]!=="")rows.push(row); row=[]; } else cur+=ch; }
    }
    if(cur!==""||row.length){row.push(cur);if(row.length>1||row[0]!=="")rows.push(row);}
    return rows;
  }

.qa .sb-group{padding:14px 12px 4px;}
.qa .sb-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--sb-muted);padding:0 10px 8px;font-weight:800;}
.qa .sb-item{position:relative;display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--sb-text);cursor:pointer;user-select:none;margin-bottom:1px;transition:background .13s,color .13s,box-shadow .13s;white-space:nowrap;overflow:hidden;}
.qa .sb-item span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qa .sb-item:hover{background:rgba(255,255,255,.05);color:#fff;}
.qa .sb-item.active{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 92%,#000) 0%,var(--accent) 100%);color:#fff;box-shadow:0 2px 10px -2px color-mix(in srgb,var(--accent) 60%,transparent);}
.qa .sb-item.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;border-radius:0 3px 3px 0;background:#fff;}
.qa .sb-item svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.9;}
.qa .sb-admin{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.08);}
.qa .sb-source{background:rgba(255,255,255,.05);border-radius:10px;padding:12px 13px;margin-bottom:10px;}
.qa .sb-source .lbl{font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.qa .sb-source .lbl svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.qa .sb-source-name{font-size:12px;font-weight:700;color:var(--sb-text);line-height:1.4;}
.qa .sb-source-link{display:inline-block;margin-top:7px;font-size:11px;font-weight:700;color:#7fb2e6;text-decoration:none;}
.qa .sb-source-link:hover{color:#a9cef0;text-decoration:underline;}
.qa .sb-upload{background:rgba(255,255,255,.05);border-radius:10px;padding:11px 12px;margin-bottom:10px;}
.qa .sb-upload .lbl{font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;gap:7px;margin-bottom:8px;}
.qa .sb-upload .lbl svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.qa .sb-upload input[type=file]{width:100%;font-size:10.5px;color:var(--sb-muted);}
.qa .sb-upload input[type=file]::file-selector-button{background:#4a4a47;color:#e6e6e4;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:4px 9px;font-size:10.5px;cursor:pointer;margin-right:7px;font-family:var(--font-body);font-weight:600;}
.qa .sb-btn{width:100%;padding:9px 11px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--sb-text);font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);margin-bottom:8px;transition:background .12s;}
.qa .sb-btn:hover{background:rgba(255,255,255,.08);}
.qa .sb-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.qa .sb-btn.primary:hover{background:var(--action-primary-hover);}
.qa .sb-mini{margin-top:8px;width:100%;padding:6px 10px;border-radius:7px;border:none;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);}
.qa .sb-mini:hover{background:var(--action-primary-hover);}
.qa .sb-note{font-size:10.5px;color:var(--sb-muted);line-height:1.5;}
.qa .main{flex:1;min-width:0;display:flex;flex-direction:column;}
.qa .topbar{background:var(--card);border-bottom:1px solid var(--border);padding:15px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;box-shadow:var(--shadow-xs);}
.qa .topbar h1{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.02em;color:var(--text);display:flex;align-items:center;gap:10px;}
.qa .topbar h1 svg{width:22px;height:22px;stroke:var(--accent);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
.qa .tb-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.qa .tb-right label{font-size:12px;color:var(--muted);font-weight:600;}
.qa input[type=date]{background:var(--card);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:8px;font-size:12.5px;font-family:var(--font-num);outline:none;}
.qa input[type=date]:focus{border-color:var(--accent);box-shadow:var(--shadow-focus);}
.qa .reset-btn{background:transparent;border:none;color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);padding:6px 9px;border-radius:7px;}
.qa .reset-btn:hover{background:var(--accent-soft);}
.qa .tb-presets{display:inline-flex;gap:3px;background:var(--neutral-100);border-radius:8px;padding:3px;}
.qa .preset-btn{border:none;background:transparent;color:var(--muted);font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:6px;cursor:pointer;font-family:var(--font-body);}
.qa .preset-btn:hover{color:var(--text);}
.qa .preset-btn.active{background:var(--card);color:var(--accent);box-shadow:var(--shadow-xs);}
.qa .team-link{background:none;border:none;padding:0;font:inherit;font-weight:700;color:var(--text);cursor:pointer;text-align:left;border-bottom:1px dotted var(--border-strong,var(--muted));}
.qa .team-link:hover{color:var(--text);border-bottom-style:solid;}
.qa .role-filter{display:inline-flex;align-items:center;gap:6px;margin-right:4px;}
.qa .excl-badge{display:inline-flex;align-items:center;gap:8px;margin-right:8px;padding:6px 6px 6px 12px;font-size:12.5px;font-weight:800;color:var(--text);border:1px solid var(--border);border-radius:var(--radius-pill);white-space:nowrap;}
.qa .excl-badge-count{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;background:var(--accent);color:#fff;border-radius:var(--radius-pill);font-family:var(--font-num);font-weight:800;}
.qa .excl-toggle input{accent-color:var(--accent);cursor:pointer;margin:0;}
.qa .excl-toggle.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.qa .role-filter label{font-size:12px;color:var(--muted);font-weight:600;}
.qa .role-filter select{padding:6px 9px;font-size:12.5px;}
.qa .role-filter.active select{border-color:var(--border-strong,var(--muted));background:var(--card);color:var(--text);font-weight:700;}
.qa .role-filter.active label{color:var(--text);}
.qa .data-source-filter{display:inline-flex;align-items:center;gap:8px;margin-right:8px;padding:4px 10px 4px 12px;border-radius:9px;background:linear-gradient(135deg,#0f2942,#1a3a5c);box-shadow:0 1px 4px rgba(15,41,66,.35);}
.qa .data-source-filter label{font-size:10.5px;color:#f4c78a;font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.qa .data-source-filter select{padding:5px 10px;font-size:12.5px;font-weight:800;background:#fff;color:#0f2942;border:1.5px solid var(--honey-600,#e07012);border-radius:6px;cursor:pointer;}
.qa .data-source-filter select:focus{outline:2px solid var(--honey-600,#e07012);outline-offset:1px;}
.qa .data-source-filter.archive{background:linear-gradient(135deg,#7a3e05,#b5650a);}
.qa .data-source-filter.archive label{color:#ffe9c7;}
.qa .ds-refresh{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:14px;line-height:1;padding:4px 8px;border-radius:6px;cursor:pointer;font-weight:700;}
.qa .ds-refresh:hover:not(:disabled){background:rgba(255,255,255,.28);}
.qa .ds-refresh:disabled{opacity:.45;cursor:default;}
.qa .ds-stamp{font-size:10.5px;font-weight:700;color:#cfe3f5;white-space:nowrap;letter-spacing:.02em;}
.qa .ds-stamp.stale{color:#ffd08a;}
.qa .data-source-filter.archive select{border-color:#ffd58a;color:#7a3e05;}
.qa .data-source-filter select:disabled{opacity:.6;cursor:wait;}
.qa .ds-spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:ds-spin .7s linear infinite;flex:0 0 auto;}
.qa .ds-progress{font-size:10.5px;font-weight:800;color:#fff;min-width:22px;}
@keyframes ds-spin{to{transform:rotate(360deg);}}
.qa .title-scope{font-family:var(--font-body);font-size:12px;font-weight:700;color:var(--accent);background:var(--blue-50);border:1px solid var(--blue-200);border-radius:var(--radius-pill);padding:3px 12px;margin-left:4px;text-transform:none;letter-spacing:0;}
.qa .am-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}
.qa .am-card{display:flex;flex-direction:column;}
.qa .am-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 18px;border-bottom:1px solid var(--border);background:var(--surface-page);}
.qa .am-name{font-family:var(--font-display);font-weight:800;font-size:16px;color:var(--text);letter-spacing:-.01em;}
.qa .am-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.qa .am-fs{font-family:var(--font-num);font-weight:800;font-size:24px;text-align:right;line-height:1;display:flex;flex-direction:column;align-items:flex-end;}
.qa .am-fs span{font-family:var(--font-body);font-weight:600;font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}
.qa .am-body{padding:10px 18px 16px;}
.qa .am-team{display:grid;grid-template-columns:110px 1fr 42px 48px;align-items:center;gap:9px;padding:5px 0;font-size:12px;}
.qa .am-team-hd{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:2px;}
.qa .am-team-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-num);}
.qa .am-team-bar{height:8px;background:var(--neutral-200);border-radius:4px;overflow:hidden;}
.qa .am-team-hd .am-team-bar{background:transparent;}
.qa .am-team-fs{text-align:right;font-family:var(--font-num);font-weight:700;}
.qa .am-team-er{text-align:right;font-family:var(--font-num);font-weight:600;}
.qa .team-count{display:inline-block;min-width:22px;text-align:center;font-family:var(--font-num);font-weight:700;font-size:11px;padding:1px 7px;border-radius:var(--radius-pill);background:var(--neutral-100);color:var(--muted);}
.qa .team-count-lo{background:var(--honey-100);color:var(--honey-700);}
.qa .content{padding:24px 28px;display:flex;flex-direction:column;gap:18px;}
.qa .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
.qa .card-head{padding:14px 20px;border-bottom:1px solid var(--border);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.qa .card-body{padding:18px 20px;}
.qa .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;}
.qa .kpi{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px 18px;}
.qa .kpi-fx{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:6px;background:var(--neutral-100);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;font-style:italic;cursor:help;line-height:1;}
.qa .kpi:hover .kpi-fx{background:var(--accent-soft,var(--accent));color:#fff;}
.qa .kpi-tip{display:none;position:absolute;top:34px;right:8px;width:230px;background:#0f1620;color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.45;font-weight:500;z-index:60;box-shadow:0 10px 28px rgba(0,0,0,.28);text-align:left;}
.qa .kpi-tip b{display:block;margin-bottom:4px;font-size:12.5px;}
.qa .kpi:hover .kpi-tip{display:block;}
.qa .fx-inline{position:relative;display:inline-flex;vertical-align:middle;margin-left:8px;}
.qa .fx-inline .kpi-fx{position:static;}
.qa .fx-inline .kpi-tip{top:26px;right:0;left:auto;}
.qa .fx-inline:hover .kpi-tip{display:block;}
.qa .dim-note{font-size:12.5px;color:var(--muted);font-style:italic;margin-bottom:14px;}
.qa .dim-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
.qa .dim-pill{border:none;background:var(--neutral-100);color:var(--text);font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:20px;cursor:pointer;font-family:var(--font-body);}
.qa .dim-pill.active{background:var(--accent);color:#fff;}
.qa .dim-label{font-weight:700;font-family:var(--font-body);}
.qa .dim-bar{min-width:140px;}
.qa .dim-bar-bg{background:var(--neutral-200);border-radius:5px;height:14px;overflow:hidden;}
.qa .dim-bar-fill{height:100%;background:var(--accent);border-radius:5px 0 0 5px;}
.qa .dim-errs{color:var(--accent);font-weight:800;}
.qa .dim-cap-note{font-size:11.5px;color:var(--muted);margin-top:10px;}
.qa .tbl-export-btn{margin-left:auto;font-size:11px;padding:4px 8px;white-space:nowrap;flex-shrink:0;}
.qa .dim-sub{color:var(--muted);font-weight:600;font-size:11px;font-family:var(--font-num);}
.qa .dim-drill{background:none;border:none;padding:0;font:inherit;font-weight:700;font-family:var(--font-body);color:var(--accent);cursor:pointer;text-align:left;border-bottom:1px dotted var(--accent);}
.qa .dim-drill:hover{border-bottom-style:solid;}
.qa .dim-drill.active{color:var(--text);border-bottom-style:solid;border-bottom-color:var(--text);}
.qa .dim-errs-btn{background:none;border:none;padding:2px 7px;border-radius:7px;font:inherit;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent);cursor:pointer;}
.qa .dim-errs-btn:hover{background:var(--blue-50);text-decoration:underline;}
.qa .dim-errs-btn.active{background:var(--accent);color:#fff;}
.qa .dim-row-on td{background:var(--blue-50);}
.qa .dim-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0 0;}
.qa .dim-tools input[type=text]{min-width:240px;}
.qa .dim-tools-count{font-size:11.5px;color:var(--muted);font-weight:600;}
.qa .dim-xscroll{overflow-x:auto;margin-top:14px;}
.qa .dim-scroll{overflow:auto;max-height:62vh;margin-top:14px;border:1px solid var(--border);border-radius:10px;contain:content;}
.qa .dim-scroll thead th{position:sticky;top:0;z-index:2;}
.qa .dim-more{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;}
.qa .dim-more-btn{border:none;background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:8px 15px;border-radius:18px;cursor:pointer;font-family:var(--font-body);}
.qa .dim-more-btn.ghost{background:var(--neutral-100);color:var(--text);}
.qa .dim-more-btn:hover{filter:brightness(1.06);}
.qa .dim-drill-close{margin-left:auto;flex-shrink:0;}
.qa .drill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;}
.qa .drill-mini{background:var(--neutral-50);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
.qa .drill-mini-t{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:12px;}
/* ---- Error genuineness review ---- */
.qa .rev-cell{white-space:nowrap;}
.qa .rev-box{display:inline-flex;align-items:center;cursor:pointer;}
.qa .rev-box input{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);margin:0;}
.qa .rev-chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.02em;vertical-align:middle;}
.qa .rev-chip.rev-gen{background:#fee2e2;color:#991b1b;}
.qa .rev-chip.rev-ing{background:#dcfce7;color:#166534;}
.qa .rev-chip.rev-none{background:var(--neutral-100);color:var(--muted);}
.qa .rev-remark{max-width:280px;white-space:normal;font-family:var(--font-body);color:var(--text);}
.qa .rev-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;}
.qa .rev-dialog{background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:100%;max-width:620px;max-height:90vh;overflow-y:auto;font-family:var(--font-body);}
.qa .rev-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--neutral-200);font-weight:700;font-size:15px;}
.qa .rev-x{margin-left:auto;background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);line-height:1;padding:2px 6px;border-radius:5px;}
.qa .rev-x:hover{background:var(--neutral-100);color:var(--text);}
.qa .rev-ctx{padding:11px 20px;background:var(--neutral-50,#f8fafc);border-bottom:1px solid var(--neutral-200);font-size:12px;color:var(--muted);}
.qa .rev-ctx-d{color:var(--muted);font-style:italic;}
.qa .rev-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
.qa .rev-f{display:flex;flex-direction:column;gap:5px;}
.qa .rev-f-wide{grid-column:1 / -1;}
.qa .rev-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
.qa .rev-f select,.qa .rev-f input,.qa .rev-f textarea{font-family:var(--font-body);font-size:13px;padding:8px 10px;border:1px solid var(--neutral-300,#cbd5e1);border-radius:7px;background:#fff;color:var(--text);width:100%;box-sizing:border-box;}
.qa .rev-f textarea{resize:vertical;min-height:64px;}
.qa .rev-f input[readonly]{background:var(--neutral-100);color:var(--muted);cursor:default;}
.qa .rev-f select:focus,.qa .rev-f textarea:focus,.qa .rev-f input:focus{outline:2px solid var(--accent);outline-offset:-1px;}
.qa .rev-err{margin:0 20px 12px;padding:9px 12px;background:#fee2e2;color:#991b1b;border-radius:7px;font-size:12px;font-weight:600;}
.qa .rev-foot{display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid var(--neutral-200);}
.qa .rev-hint{font-size:11px;color:var(--muted);margin-right:auto;max-width:280px;}
.qa .rev-btn{font-family:var(--font-body);font-size:13px;font-weight:700;padding:8px 18px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;}
.qa .rev-btn:hover:not(:disabled){filter:brightness(1.08);}
.qa .rev-btn:disabled{opacity:.6;cursor:default;}
.qa .rev-btn.ghost{background:#fff;color:var(--text);border-color:var(--neutral-300,#cbd5e1);}
.qa .rev-btn.ghost:hover:not(:disabled){background:var(--neutral-100);}
@media (max-width:560px){ .qa .rev-body{grid-template-columns:1fr;} }
.qa .rankbar-val-btn{background:none;border:none;padding:0;font:inherit;font-family:inherit;color:inherit;cursor:pointer;}
/* ---- leaderboard row styling (was inline on every row; 250 rows x ~300
       repeated chars each made the page ~30% bigger than it needed to be) ---- */
.qa .spk{display:block;width:80px;height:22px;}
.qa .mist-loading{color:var(--muted);font-weight:600;}
.qa .live-fail{background:#fef2f2;border:1px solid #fecaca;border-left:4px solid var(--red);border-radius:8px;padding:14px 16px;margin-bottom:18px;font-family:var(--font-body);}
.qa .live-fail-t{font-weight:800;font-size:13.5px;color:#991b1b;margin-bottom:6px;}
.qa .live-fail-b{font-size:12.5px;color:#7f1d1d;line-height:1.55;margin-top:5px;}
.qa .live-fail-b a{color:#991b1b;font-weight:700;}
.qa .spk polyline{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.qa .tr{font-weight:700;}
.qa .tr-f{color:var(--muted);}
.qa .tr-u{color:var(--green);}
.qa .tr-d{color:var(--red);}
.qa .rank-badge.rk-top{background:var(--honey-600);color:#fff;}
.qa .rank-badge.rk-nom{background:var(--neutral-100);color:var(--muted);}
.qa td.c-name{font-weight:700;font-family:var(--font-body);}
.qa .traj{display:flex;align-items:center;gap:6px;}
.qa .fs-v{font-weight:800;}
.qa td.er-v{font-weight:700;}
.qa td.c-proc{color:var(--proc);}
.qa td.c-mut{color:var(--muted);}
.qa .rankbar-val-btn:hover{text-decoration:underline;}

.qa .kpi .k-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:6px;}
.qa .kpi .k-val{font-size:26px;font-weight:800;font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--text);}
.qa .kpi .k-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.qa .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
@media(max-width:1100px){.qa .grid-2{grid-template-columns:1fr;}}
.qa select,.qa input[type=text]{background:var(--card);border:1px solid var(--border);color:var(--text);padding:7px 11px;border-radius:8px;font-size:13px;font-family:var(--font-body);outline:none;}
.qa select:focus,.qa input[type=text]:focus{border-color:var(--accent);box-shadow:var(--shadow-focus);}
.qa .ctrl-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.qa .ctrl-row label{font-size:12px;color:var(--muted);font-weight:600;}
.qa .tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.qa .tbl th{padding:10px 15px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;background:var(--neutral-50);}
.qa .tbl th.r,.qa .tbl td.r{text-align:right;}
.qa .tbl td{padding:9px 15px;border-bottom:1px solid var(--border);font-family:var(--font-num);font-variant-numeric:tabular-nums;vertical-align:middle;}
.qa .tbl tr:last-child td{border-bottom:none;}
.qa .tbl tbody tr:hover td{background:var(--blue-50);}
.qa .order-link{color:var(--accent);font-weight:700;text-decoration:none;font-size:11.5px;white-space:nowrap;}
.qa .order-link:hover{text-decoration:underline;}
.qa .order-link-icon{font-size:13px;color:var(--honey-600,#e07012);margin-left:3px;display:inline-block;font-weight:800;transition:transform .12s ease-out;}
.qa .order-link:hover .order-link-icon{transform:scale(1.18);}
.qa .tag{display:inline-block;font-size:10px;padding:2px 9px;border-radius:var(--radius-pill);font-weight:700;white-space:nowrap;font-family:var(--font-body);}
.qa .tag-proc{background:var(--persimmon-100);color:var(--proc);}
.qa .tag-pp{background:var(--ube-100);color:var(--pp);}
.qa .tag-hdr{background:var(--blue-100);color:var(--hdr);}
.qa .tag-line{background:var(--teal-100);color:var(--line);}
.qa .tag-misc{background:var(--honey-100);color:var(--misc);}
.qa .tag-team{background:var(--blue-50);color:var(--accent);border:1px solid var(--blue-200);}
.qa .pill-good{background:var(--teal-100);color:var(--green);}
.qa .pill-bad{background:var(--persimmon-100);color:var(--red);}
.qa .rank-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11.5px;font-weight:800;font-family:var(--font-num);}
.qa .ibar-wrap{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.qa .ibar-bg{width:80px;height:7px;background:var(--neutral-200);border-radius:4px;overflow:hidden;flex-shrink:0;}
.qa .ibar-fill{height:100%;border-radius:4px;background:var(--accent);}
.qa .placeholder-msg{padding:42px;text-align:center;color:var(--muted);font-size:13px;}
.qa .note-strip{font-size:11px;color:var(--muted);padding:10px 20px;border-top:1px solid var(--border);font-style:italic;}
.qa .cmp-dual{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:14px;}
.qa .cmp-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:7px;}
.qa .cmp-side-label{font-size:15px;font-weight:800;font-family:var(--font-num);}
.qa .cmp-bar-wrap{height:10px;background:var(--neutral-200);border-radius:5px;overflow:hidden;}
.qa .cmp-bar-fill{height:100%;border-radius:5px;}
.qa .cmp-vs{font-size:10px;color:var(--muted);font-weight:700;}
.qa .delta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:6px;}
.qa .delta-card{background:var(--surface-page);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;text-align:center;}
.qa .d-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:4px;}
.qa .d-val{font-size:20px;font-weight:800;font-family:var(--font-num);}
.qa .d-sub{font-size:10.5px;color:var(--muted);}
.qa .delta-pos{color:var(--green);}.qa .delta-neg{color:var(--red);}.qa .delta-neu{color:var(--muted);}
.qa .footer{padding:16px 28px;font-size:11px;color:var(--muted);border-top:1px solid var(--border);text-align:center;background:var(--card);}
.qa .chart-note{font-size:10.5px;color:var(--muted);margin-top:10px;font-style:italic;}
.qa .chart-sub{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.qa .catbars{display:flex;flex-direction:column;gap:17px;}
.qa .catbar{display:flex;align-items:center;gap:12px;}
.qa .catbar-rank{flex-shrink:0;width:24px;height:24px;border-radius:7px;background:var(--neutral-100);color:var(--muted);font-family:var(--font-num);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.qa .catbar:nth-child(1) .catbar-rank{background:var(--honey-600,#c98a00);color:#fff;}
.qa .catbar-main{flex:1;min-width:0;}
.qa .catbar-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:7px;}
.qa .catbar-lbl{font-family:var(--font-display);font-size:13.5px;font-weight:700;letter-spacing:-.01em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qa .catbar-val{display:inline-flex;align-items:baseline;gap:7px;font-family:var(--font-num);font-size:15px;font-weight:800;color:var(--text);flex-shrink:0;}
.qa .catbar-pct{font-family:var(--font-num);font-size:11px;font-weight:800;color:var(--muted);background:var(--neutral-100);border-radius:var(--radius-pill);padding:1px 8px;}
.qa .catbar-track{height:13px;background:var(--neutral-200);border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,22,36,.08);}
.qa .catbar-fill{height:100%;border-radius:7px;transform-origin:left center;box-shadow:0 1px 4px -1px rgba(15,22,36,.28);}
.qa .qa-modal{position:fixed;inset:0;background:rgba(15,22,36,.55);backdrop-filter:blur(2px);z-index:9999;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
.qa .qa-modal-box{background:#fff;border-radius:14px;max-width:760px;width:100%;box-shadow:0 30px 70px -20px rgba(15,22,36,.6);overflow:hidden;}
.qa .qa-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#12161c;color:#fff;font-weight:800;font-size:16px;}
.qa .qa-modal-x{background:none;border:none;color:#aeb9c9;font-size:24px;line-height:1;cursor:pointer;padding:0 4px;}
.qa .qa-modal-x:hover{color:#fff;}
.qa .qa-modal-sub{padding:12px 22px 0;font-size:12.5px;color:var(--muted);}
.qa .qa-modal-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--border);}
.qa .qa-modal-actions .sb-mini{cursor:pointer;}
.qa .qa-copy-note{font-size:12.5px;color:var(--green);font-weight:700;}
.qa .qa-modal-scroll{padding:22px;max-height:60vh;overflow:auto;background:var(--surface-page);}
.qa .shout-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px;}
@media(max-width:1100px){.qa .shout-grid{grid-template-columns:repeat(2,1fr);}}
.qa .so-card{background:linear-gradient(155deg,#2b3543 0%,#1b232d 100%);border:1px solid rgba(255,255,255,.07);border-radius:var(--radius-lg);padding:15px 18px;box-shadow:0 12px 30px -18px rgba(15,22,36,.7);animation:me-fly .55s cubic-bezier(.22,.61,.36,1) both;}
.qa .so-name{font-family:var(--font-display);font-weight:800;font-size:18px;color:#fff;letter-spacing:-.01em;line-height:1.12;margin-bottom:8px;word-break:break-word;}
.qa .so-namebtn{font-family:inherit;font-weight:inherit;font-size:inherit;color:#fff;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;}
.qa .so-namebtn:hover{color:var(--teal-300,#7fe0d4);text-decoration:underline;}
.qa .so-star{color:var(--gold);font-size:12px;vertical-align:1px;}
.qa .so-role{font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--gold);margin-bottom:8px;}
.qa .so-stat{font-size:12px;font-weight:600;color:#aeb9c9;font-family:var(--font-num);}
.qa .mm-arearow{display:flex;gap:14px;flex-wrap:wrap;}
.qa .mm-area{background:var(--neutral-50,#f9fafb);border:1px solid var(--border);border-left:3px solid #2563EB;border-radius:var(--radius-md,8px);padding:15px 18px;min-width:130px;}
.qa .mm-area-lbl{font-size:11px;font-weight:700;letter-spacing:.04em;margin-bottom:7px;}
.qa .mm-area-val{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text);line-height:1;}
.qa .mm-area-sub{font-size:11px;color:var(--muted);margin-top:6px;}
.qa .mx-grid{display:flex;flex-direction:column;gap:7px;}
.qa .mx-row{display:grid;grid-template-columns:130px repeat(3,1fr);gap:7px;align-items:center;}
.qa .mx-head .mx-col-h{font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--muted);text-align:center;}
.qa .mx-lbl{font-family:var(--font-num);font-size:11.5px;font-weight:600;color:var(--text2,#3d434d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qa .mx-cell{height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;}
.qa .team-tag-link{border:1px solid var(--border);cursor:pointer;font-family:var(--font-body);}
.qa .team-tag-link:hover{background:var(--accent-soft,#eef3ff);color:var(--accent);border-color:var(--accent);}
.qa .mx-empty{background:var(--neutral-100,#f3f4f6);}
.qa svg .dn-seg{transition:opacity .14s,stroke-width .14s;cursor:pointer;}
.qa svg:hover .dn-seg{opacity:.4;}
.qa svg .dn-seg:hover{opacity:1;stroke-width:34;}
.qa svg .pt-dot,.qa .me-chart circle{cursor:pointer;transition:r .12s;}
.qa svg .pt-dot:hover,.qa .me-chart circle:hover{r:6;}
.qa .me-chart rect:hover{filter:brightness(1.12);cursor:pointer;}
@keyframes me-fly{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes me-draw{from{stroke-dashoffset:2600}to{stroke-dashoffset:0}}
.qa .me-chart path.me-trend{stroke-dasharray:2600;animation:me-draw 1.1s cubic-bezier(.65,.02,.35,1) forwards;}
@keyframes me-growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.qa .me-chart rect.me-growy{animation:me-growy .7s cubic-bezier(.22,.61,.36,1) both;}
@keyframes me-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qa .me-grow{transform-origin:left center;animation:me-grow .8s cubic-bezier(.22,.61,.36,1) both;}
.qa .exec-hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#12161c 0%,#1b2430 46%,#243247 100%);color:#fff;border-radius:var(--radius-lg);padding:30px 34px;display:flex;align-items:center;justify-content:space-between;gap:24px;box-shadow:0 18px 40px -18px rgba(15,23,36,.7);flex-wrap:wrap;border:1px solid rgba(255,255,255,.07);}
.qa .exec-hero::before{content:"";position:absolute;top:-40%;right:-6%;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 42%,transparent) 0%,transparent 68%);pointer-events:none;}
.qa .exec-hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 30%,transparent));}
.qa .exec-hero-l{position:relative;z-index:1;}
.qa .exec-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#dbe4f0;font-weight:800;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);padding:4px 11px;border-radius:var(--radius-pill);}
.qa .exec-period{font-family:var(--font-num);font-size:15px;color:#aeb9c9;margin-top:12px;font-weight:600;letter-spacing:.01em;}
.qa .exec-verdict{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin-top:14px;max-width:640px;line-height:1.35;display:flex;align-items:baseline;gap:10px;}
.qa .exec-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;transform:translateY(-1px);box-shadow:0 0 0 4px color-mix(in srgb,currentColor 22%,transparent);}
.qa .exec-hero-r{position:relative;z-index:1;text-align:right;padding-left:26px;border-left:1px solid rgba(255,255,255,.12);}
.qa .exec-big{font-family:var(--font-num);font-weight:800;font-size:62px;line-height:1;letter-spacing:-.03em;background:linear-gradient(180deg,#ffffff,#c7d3e4);-webkit-background-clip:text;background-clip:text;color:transparent;}
.qa .exec-big-lbl{font-size:12px;color:#aeb9c9;margin-top:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;}
.qa .d-chip{display:inline-block;font-family:var(--font-num);font-weight:700;font-size:11px;padding:1px 8px;border-radius:var(--radius-pill);border:1px solid transparent;}
.qa .d-up{background:color-mix(in srgb,var(--green) 12%,transparent);color:var(--green);border-color:color-mix(in srgb,var(--green) 26%,transparent);}
.qa .d-down{background:color-mix(in srgb,var(--red) 11%,transparent);color:var(--red);border-color:color-mix(in srgb,var(--red) 24%,transparent);}
.qa .d-neu{background:var(--neutral-100);color:var(--muted);border-color:var(--border);}
.qa .exec-big-lbl .d-chip{background:rgba(255,255,255,.16);color:#fff;font-size:12px;border-color:rgba(255,255,255,.22);backdrop-filter:blur(2px);}
.qa .hl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;}
.qa .hl-title{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.qa .hl-row{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px;}
.qa .hl-rank{width:18px;text-align:center;font-family:var(--font-num);font-size:11px;color:var(--muted);font-weight:700;flex-shrink:0;}
.qa .hl-name{flex:1;font-family:var(--font-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.qa .hl-val{font-family:var(--font-num);font-weight:800;}
.qa .meth-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
.qa .meth-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:15px 16px;background:var(--surface-page);}
.qa .meth-card .m-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin-bottom:9px;}
.qa .meth-card .m-f{font-family:var(--font-num);font-size:13px;font-weight:700;color:var(--text);background:var(--blue-50);border:1px solid var(--blue-200);border-radius:var(--radius-sm);padding:8px 10px;margin-bottom:9px;line-height:1.4;}
.qa .meth-card .m-d{font-size:11.5px;color:var(--muted);line-height:1.55;}
.qa .meth-note{font-size:11.5px;color:var(--muted);line-height:1.65;border-top:1px solid var(--border);padding-top:13px;}
.qa .meth-note b{color:var(--text);font-weight:700;}
@keyframes me-draw{from{stroke-dashoffset:2600}to{stroke-dashoffset:0}}
@keyframes me-fade{from{opacity:0}to{opacity:1}}
@keyframes me-rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes me-fly{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes me-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.qa .anim-chart path.me-trend,.qa .me-chart path.me-trend{stroke-dasharray:2600;animation:me-draw 1.15s cubic-bezier(.65,.02,.35,1) forwards;}
.qa .anim-chart circle,.qa .anim-chart text,.qa .me-chart circle,.qa .me-chart text{animation:me-fade .7s .55s ease-out both;}
.qa .me-chart .me-area{animation:me-fade .8s .5s ease-out both;}
.qa .me-grow{transform-origin:left center;animation:me-grow .85s cubic-bezier(.22,.61,.36,1) both;}
.qa .cmp-bar-wrap[style*="rtl"] .me-grow{transform-origin:right center;}
.qa #qa-content>.card,.qa #qa-content>.grid-2>.card,.qa #qa-content>.kpi-row{animation:me-fly .5s cubic-bezier(.22,.61,.36,1) both;}
.qa #qa-content>.card:nth-child(1),.qa #qa-content>.kpi-row:nth-child(1){animation-delay:.02s}
.qa #qa-content>.card:nth-child(2),.qa #qa-content>.kpi-row:nth-child(2){animation-delay:.08s}
.qa #qa-content>.card:nth-child(3){animation-delay:.14s}
.qa #qa-content>.card:nth-child(4){animation-delay:.2s}
.qa #qa-content>.card:nth-child(5){animation-delay:.26s}
.qa #qa-content>.grid-2{animation:me-fly .5s .14s cubic-bezier(.22,.61,.36,1) both;}
@media(prefers-reduced-motion:reduce){.qa .me-trend,.qa .me-grow,.qa .me-chart circle,.qa .me-chart text,.qa .me-area,.qa #qa-content>.card,.qa #qa-content>.grid-2,.qa #qa-content>.grid-2>.card,.qa #qa-content>.kpi-row{animation:none!important;}}
.qa .anim-kpi .kpi{animation:me-rise .5s ease-out both;}
.qa .anim-kpi .kpi:nth-child(1){animation-delay:.02s}.qa .anim-kpi .kpi:nth-child(2){animation-delay:.08s}.qa .anim-kpi .kpi:nth-child(3){animation-delay:.14s}.qa .anim-kpi .kpi:nth-child(4){animation-delay:.2s}.qa .anim-kpi .kpi:nth-child(5){animation-delay:.26s}.qa .anim-kpi .kpi:nth-child(6){animation-delay:.32s}
@media(max-width:840px){.qa .app{flex-direction:column;}.qa .sidebar{width:100%;height:auto;position:static;}.qa .content,.qa .topbar{padding-left:16px;padding-right:16px;}}
.qa .mist-clickable{cursor:pointer;}
.qa .mist-clickable:hover{opacity:.8;}
.qa .dn-seg.mist-clickable:hover{stroke-width:34;}
.qa th.mist-th{user-select:none;}
.qa th.mist-th:hover{color:var(--accent);}
.qa .sort-arrow{font-size:9px;color:var(--accent);}
.qa .chart-toolbar{margin-top:16px;padding:14px 10px;background:var(--surface-page,#f5f7fa);border:1px solid var(--border-subtle,#e5e5e5);border-radius:10px;}
.qa .chart-toolbar .reset-btn{margin:0 4px;}`;
  }
}
